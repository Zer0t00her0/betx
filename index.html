.tcard{flex:1 0 240px;display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);padding:var(--sp-4);background:var(--panel);border-radius:var(--r-lg);text-align:center}

/* игровой автомат */
.mach{position:relative;display:flex;flex-direction:column;background:var(--page);border-radius:var(--r-lg);overflow:hidden;user-select:none}

.mach-bet{display:flex;align-items:center;height:40px;background:var(--page);border-radius:var(--r-md)}

/* карточка игры */
.ginfo{display:grid;grid-template-columns:242px minmax(0,1fr);gap:var(--sp-6);max-width:var(--maxw);margin:0 var(--sp-4) var(--sp-4) 0;padding:var(--sp-6);background:var(--panel);border-radius:var(--r-lg)}

.ghead{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-3)}

.gchips span.r{color:var(--accent-red)}.gchips span.g{color:var(--accent-green)}
.gdesc{color:var(--ink2);font-size:15px;margin:0 0 var(--sp-4)}
.gtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);margin-bottom:var(--sp-3)}

.vol{display:flex;gap:var(--sp-1);align-items:flex-end;height:16px;flex:none}.vol i{width:4px;background:var(--page)}.vol i.on{background:var(--accent-red)}

.about{max-width:var(--maxw);margin:0 var(--sp-4) var(--sp-8) 0;padding:var(--sp-6);background:var(--panel);border-radius:var(--r-lg)}

/* футер */
.pays{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-6);flex-wrap:wrap;max-width:var(--maxw);margin:var(--sp-12) var(--sp-4) var(--sp-8) 0;padding:var(--sp-6) var(--sp-6);background:var(--panel);border-radius:var(--r-lg);color:var(--muted);font-weight:900;font-size:17px;letter-spacing:.5px}

@media (max-width:1180px){.tiles{grid-template-columns:repeat(3,1fr)}.gp{grid-template-columns:1fr}.gp-side{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3)}.gtiles{grid-template-columns:repeat(2,1fr)}}

  .foot{grid-template-columns:1fr;margin-right:var(--sp-3)}.pays,.copy{margin-right:var(--sp-3)}
  .mach.big .mach-stage{min-height:220px}
}

/* ===== Этап 2: кабинет ===== */
.cabt{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:var(--card-gap);max-width:var(--maxw);margin:0 var(--sp-4) var(--sp-3) 0}

.cabw{max-width:820px;margin:0 auto}
.seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--sp-1);padding:var(--sp-1);background:var(--page);border-radius:var(--r-md);margin-bottom:var(--sp-4)}
.seg2 button{height:38px;border-radius:var(--r-md);font-weight:600;font-size:15px;color:var(--muted);transition:background .2s,color .2s}
.seg2 button.on{background:var(--accent-red);color:#fff}
.c2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--sp-4);align-items:start}
.lab{display:block;margin:0 0 var(--sp-2);color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.opts{display:flex;flex-direction:column;gap:var(--sp-2);margin-bottom:var(--sp-4)}
.opt{display:flex;align-items:center;gap:var(--sp-3);height:46px;padding:0 var(--sp-4);background:var(--card);border-radius:var(--r-md);text-align:left;transition:box-shadow .2s}
.opt:hover{box-shadow:inset 0 0 0 1px var(--muted)}
.opt.on{box-shadow:inset 0 0 0 1px var(--accent-red)}
.opt .bd{width:38px;height:24px;flex:none;display:grid;place-items:center;border-radius:var(--r-xs);background:#fff;color:#11162e;font-size:9px;font-weight:900}
.opt b{flex:1;font-size:14px;font-weight:600}
.opt small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:var(--sp-2)}
.opt small::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-green)}
.opt .rd{width:18px;height:18px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 2px var(--muted)}
.opt.on .rd{box-shadow:inset 0 0 0 5px var(--accent-red)}
.inp{display:flex;align-items:center;gap:var(--sp-2);height:50px;padding:0 var(--sp-2) 0 var(--sp-4);background:var(--page);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:var(--sp-3)}
.inp:focus-within{border-color:var(--glow-blue)}
.inp input,.inp select{flex:1;min-width:0;height:100%;background:none;border:0;color:var(--ink);font:600 17px var(--font);outline:none}
.inp select option{background:var(--panel)}
.inp .cur{color:var(--muted);font-size:13px;font-weight:600}
.inp .mini{height:34px;padding:0 var(--sp-3);background:var(--card);border-radius:var(--r-md);font-size:13px;font-weight:600;color:var(--ink);flex:none}
.inp.big input{text-align:right;font-size:20px}
.inp.err{border-color:var(--accent-red)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);margin-bottom:var(--sp-2)}
.qa .b{height:40px;font-size:15px;padding:0}
.hint{color:var(--muted);font-size:12px;margin:0 0 var(--sp-4)}
.hint.e{color:var(--accent-red)}
.sum{padding:var(--sp-3) var(--sp-4);background:var(--card);border-radius:var(--r-lg);margin-bottom:var(--sp-3);font-size:14px}
.sum div{display:flex;justify-content:space-between;padding:var(--sp-1) 0;color:var(--muted)}
.sum div b{color:var(--ink);font-weight:600}
.sum .tot{border-top:1px solid var(--line);margin-top:var(--sp-2);padding-top:var(--sp-3);color:var(--ink)}
.sum .tot b{color:var(--accent-green);font-size:17px}
.cta{width:100%;height:52px;font-size:17px}
.note2{text-align:center;color:var(--muted);font-size:12px;margin-top:var(--sp-2)}
.warn{padding:var(--sp-3) var(--sp-3);margin:0 0 var(--sp-4);background:color-mix(in srgb,#ffb347 12%,var(--page));color:#ffb347;font-size:13px;border-radius:var(--r-lg)}
.nets{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);margin-bottom:var(--sp-3)}
.nets button{height:52px;background:var(--card);border-radius:var(--r-md);font-weight:700;font-size:15px;transition:background .2s,box-shadow .2s}
.nets button small{display:block;color:var(--muted);font-size:11px;font-weight:500}
.nets button.on{background:var(--accent-red)}.nets button.on small{color:#fff}
.qr{width:168px;height:168px;padding:var(--sp-3);background:#fff;border-radius:var(--r-md);display:grid;grid-template-columns:repeat(21,1fr);margin-bottom:var(--sp-3)}
.qr i{background:#0b0f2a}.qr i.o{background:transparent}
.addr{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);background:var(--page);border-radius:var(--r-md);font:500 14px ui-monospace,Menlo,monospace;word-break:break-all;margin-bottom:var(--sp-3)}
.addr span{flex:1}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin:var(--sp-6) 0 var(--sp-3)}
.ttl b{font-size:17px}.ttl .cnt{margin-left:var(--sp-2);padding:1px var(--sp-2);background:var(--card);font-size:12px;border-radius:var(--r-sm)}
.ttl button{color:var(--accent-red);font-size:13px;font-weight:600}
.tw{overflow-x:auto}
.tt{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14px;min-width:720px}
.tt th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:0 var(--sp-3)}
.tt td{padding:var(--sp-3);background:var(--card)}
.tt td:first-child{border-radius:var(--r-md) 0 0 var(--r-md)}.tt td:last-child{border-radius:0 var(--r-md) var(--r-md) 0}
.tt .mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.tt .cp{color:var(--muted);margin-left:var(--sp-2)}.tt .cp:hover{color:var(--ink)}
.tt .num{font-variant-numeric:tabular-nums;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:var(--sp-2);height:24px;padding:0 var(--sp-3);border-radius:var(--r-md);font-size:12px;font-weight:600;background:var(--page)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--accent-green)}.pill.bad{color:var(--accent-red)}.pill.wait{color:#ffb347}.pill.proc{color:#9b8cff}.pill.act{color:var(--sky,#01aaff)}
.lnk{color:var(--accent-red);font-weight:600;font-size:13px}.lnk:hover{text-decoration:underline}
.mutedt{color:var(--muted);font-size:13px}
.det td{background:var(--page)!important;padding:var(--sp-4)!important}
.det .dl{display:flex;gap:var(--sp-6);flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:var(--sp-3)}.det .dl b{color:var(--ink);margin-left:var(--sp-2)}
.det .tr{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;padding:var(--sp-2) var(--sp-3);margin-top:var(--sp-2);background:var(--panel);border-radius:var(--r-sm);font-size:13px;width:max-content;max-width:100%}
.det .tr .k{padding:var(--sp-0) var(--sp-2);background:var(--card);border-radius:var(--r-xs);font-weight:700}.det .tr .k.w{background:var(--accent-red)}
.fbar{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-4)}
.fbar .b{height:38px;font-size:14px;padding:0 var(--sp-4)}
.fbar .sp{flex:1}
.fbar .sep{width:1px;height:28px;background:var(--line);margin:0 var(--sp-1)}
.date{position:relative;display:inline-flex;align-items:center;gap:var(--sp-2);height:38px;padding:0 var(--sp-3);background:var(--card);border-radius:var(--r-md);font-size:14px;font-weight:600;cursor:pointer}
.date input{position:absolute;inset:0;opacity:0;cursor:pointer}
.date svg{width:16px;height:16px}
.pager{display:flex;justify-content:center;gap:var(--sp-2);margin-top:var(--sp-4)}
.pager button{min-width:36px;height:36px;padding:0 var(--sp-2);background:var(--card);border-radius:var(--r-md);font-weight:600;font-size:14px}
.pager button.on{background:var(--accent-red)}
.pager span{align-self:center;color:var(--muted)}
.slipc{padding:var(--sp-4);background:var(--card);border-radius:var(--r-lg);margin-bottom:var(--sp-3)}
.slipc header{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-3);font-size:13px;color:var(--muted)}
.slipc .sel{display:flex;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-2) 0;border-top:1px solid var(--line);font-size:14px}
.slipc .sel small{display:block;color:var(--muted);font-size:12px}
.slipc footer{display:flex;align-items:center;gap:var(--sp-6);flex-wrap:wrap;margin-top:var(--sp-3);font-size:13px;color:var(--muted)}
.slipc footer b{display:block;color:var(--ink);font-size:16px}
.slipc footer .b{margin-left:auto;height:40px}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.vcard{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-4) var(--sp-4);background:var(--card);border-radius:var(--r-lg)}
.vcard div{flex:1}.vcard b{display:block;font-size:16px;margin-bottom:var(--sp-1)}.vcard p{margin:0;color:var(--ink2);font-size:13px}
.vbad{display:flex;flex-direction:column;align-items:center;gap:var(--sp-0);font-size:11px;color:var(--accent-green);flex:none}
.vbad svg{width:26px;height:26px}
.vbad.no{color:#ffb347}
.pfield{display:flex;align-items:center;gap:var(--sp-3);min-height:58px;padding:var(--sp-2) var(--sp-4);background:var(--card);border-radius:var(--r-md)}
.pfield div{flex:1;min-width:0}
.pfield small{display:block;color:var(--muted);font-size:12px}
.pfield b{font-weight:500;font-size:16px}
.pfield .mini{height:32px;padding:0 var(--sp-4);background:var(--panel);border-radius:var(--r-md);font-size:13px;font-weight:600}
.pfield .mini.r{background:var(--accent-red)}
.pfield .cpy{color:var(--muted)}.pfield .cpy:hover{color:var(--ink)}
.pf .b{height:52px;font-size:16px}
.estate{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-2);border-radius:var(--r-lg);background:var(--card);font-size:14px}
.estate div{flex:1}.estate b{display:block}.estate small{color:var(--muted)}
.estate.e{box-shadow:inset 3px 0 0 var(--accent-red)}.estate.w{box-shadow:inset 3px 0 0 #ffb347}.estate.ok{box-shadow:inset 3px 0 0 var(--accent-green)}
.pin{display:flex;justify-content:center;gap:var(--sp-3);margin:var(--sp-4) 0}
.pin i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--muted);transition:background .15s,box-shadow .15s}
.pin i.f{background:var(--accent-red);box-shadow:none}
.pin.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:var(--sp-3);justify-content:center}
.pad button{height:56px;background:var(--card);border-radius:var(--r-md);font-size:22px;font-weight:600}
.pad button:active{background:var(--accent-red)}
.sw{position:relative;width:46px;height:26px;flex:none;border-radius:var(--r-md);background:var(--card);transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.34,1.5,.64,1)}
.sw.on{background:var(--accent-red)}.sw.on::after{transform:translateX(20px)}
.okbox{text-align:center;padding:var(--sp-8) var(--sp-3)}
.okbox .big{width:72px;height:72px;margin:0 auto var(--sp-4);display:grid;place-items:center;border-radius:50%;background:var(--accent-red);animation:hit .6s cubic-bezier(.34,1.6,.64,1)}
.okbox .big svg{width:36px;height:36px}
.okbox b{display:block;font-size:22px;margin-bottom:var(--sp-2)}.okbox p{color:var(--muted);margin:0 0 var(--sp-4)}
@media (max-width:1180px){.cabt{grid-template-columns:repeat(5,1fr)}}
@media (max-width:900px){
  .cabt{display:flex;overflow-x:auto;scrollbar-width:none;margin-right:var(--sp-3)}.cabt::-webkit-scrollbar{display:none}
  .cabt button{flex:none;width:96px;min-height:84px;font-size:12px}
  .cabp{padding:var(--sp-4);margin-right:var(--sp-3)}.c2{grid-template-columns:1fr}.pf{grid-template-columns:1fr}
  .fbar .sp{display:none}.fbar .sep{display:none}
}

/* редактор отключён */
.eb,.ed,.dock>*:not(#vmBtn):not(#icBtn){display:none!important}
@media (max-width:900px){.dock{display:none!important}}
.c2>div,.cabw{min-width:0}.opt{min-width:0}.opt b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===== Этап 3: промо, 404, вход, победители ===== */
.gst{display:none;gap:var(--sp-2)}
.gst .b{height:42px;padding:0 var(--sp-6);font-weight:700}
body.guest .gst{display:flex}
body.guest #hdr .wallet,body.guest #hdr .me,body.guest #hdr .bell{display:none!important}
/* формы входа */
.dlg.auth{width:min(440px,100%)}
.dlg.auth .bd{padding-top:var(--sp-3)}
.atabs{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-1);padding:var(--sp-1);background:var(--page);border-radius:var(--r-md);margin:0 0 var(--sp-4)}
.atabs button{height:40px;border-radius:var(--r-md);font-weight:700;color:var(--muted);transition:background .2s,color .2s}
.atabs button.on{background:var(--accent-red);color:#fff}
.steps{display:flex;gap:var(--sp-2);margin:0 0 var(--sp-4)}
.steps i{flex:1;height:4px;border-radius:var(--r-xs);background:var(--line)}
.steps i.on{background:var(--accent-red)}
.auth .inp{margin-bottom:var(--sp-1)}
.auth .inp.ok{border-color:var(--accent-green)}
.auth .em{min-height:18px;margin:0 0 var(--sp-2);font-size:12px;color:var(--accent-red)}
.auth .em.ok{color:var(--accent-green)}
.auth .inp .eye{width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.auth .inp .eye svg{width:20px;height:20px}
.auth .inp .mini{height:36px;padding:0 var(--sp-3);border-radius:var(--r-md);background:var(--card);font-size:13px;font-weight:700;white-space:nowrap}
.auth .row3{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:var(--sp-2)}
.auth .row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.auth .lnk{color:#8fa0ff;font-size:14px;font-weight:600}
.auth .lnk:hover{color:var(--ink)}
.auth .lnks{display:flex;justify-content:space-between;margin:var(--sp-0) 0 var(--sp-4)}
.auth .foot2{text-align:center;color:var(--muted);font-size:14px;margin-top:var(--sp-4)}
.auth .chk{display:flex;gap:var(--sp-3);align-items:flex-start;margin:var(--sp-2) 0 var(--sp-3);font-size:13px;color:var(--ink2);cursor:pointer;text-align:left}
.auth .chk input{appearance:none;width:20px;height:20px;flex:none;margin:0;border-radius:var(--r-xs);box-shadow:inset 0 0 0 2px var(--muted);cursor:pointer;transition:box-shadow .15s}
.auth .chk input:checked{box-shadow:inset 0 0 0 10px var(--accent-red)}
.auth .chk.bad input{box-shadow:inset 0 0 0 2px var(--accent-red)}
.auth .or{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-4) 0;color:var(--muted);font-size:12px;font-weight:700}
.auth .or::before,.auth .or::after{content:"";flex:1;height:1px;background:var(--line)}
.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2)}
.socials button{height:46px;display:flex;align-items:center;justify-content:center;gap:var(--sp-2);background:var(--card);border-radius:var(--r-md);font-weight:600;font-size:14px;transition:box-shadow .2s}
.socials button:hover{box-shadow:inset 0 0 12px 4px color-mix(in srgb,var(--glow-blue) 40%,transparent)}
.socials svg{width:20px;height:20px}
.auth .b.full{width:100%;height:50px;font-size:16px;font-weight:700}
.auth .note{color:var(--muted);font-size:13px;margin:0 0 var(--sp-4)}
.auth .done{text-align:center;padding:var(--sp-3) 0}
.auth .done .big{font-size:64px;line-height:1;margin-bottom:var(--sp-3)}
/* мобильное меню профиля */
.pdraw .who{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.pdraw .ava{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--accent-red);font-weight:800;font-size:18px}
.pdraw .who b{display:block;font-size:17px}
.pdraw .who small{color:var(--muted);display:flex;align-items:center;gap:var(--sp-2)}
.pdraw .who small button{color:#8fa0ff;font-size:12px;font-weight:700}
.pdraw .balc{padding:var(--sp-4);border-radius:var(--r-lg);background:var(--page);margin-bottom:var(--sp-3)}
.pdraw .balc small{color:var(--muted);font-size:12px}
.pdraw .balc b{display:block;font-size:26px;margin:var(--sp-0) 0 var(--sp-3)}
.pdraw .balc .b{width:100%;height:46px;font-weight:700}
.pdraw .lst{display:flex;flex-direction:column;gap:var(--sp-1)}
.pdraw .lst button{display:flex;align-items:center;gap:var(--sp-3);height:46px;padding:0 var(--sp-3);border-radius:var(--r-md);background:var(--card);text-align:left;font-weight:600}
.pdraw .lst button svg{width:20px;height:20px;color:var(--muted)}
.pdraw .lst .out{color:var(--accent-red);margin-top:var(--sp-2)}
/* победитель */
.dlg.win{width:min(520px,100%)}
.winc{display:grid;grid-template-columns:150px 1fr;gap:var(--sp-4);align-items:center;margin-bottom:var(--sp-4)}
.winc .cv{position:relative;aspect-ratio:3/4;border-radius:var(--r-lg);overflow:hidden;background:var(--bg)}
.winc .cv img{width:100%;height:100%;object-fit:cover}
.wtag{display:inline-block;padding:var(--sp-1) var(--sp-3);border-radius:var(--r-sm);background:var(--accent-red);font-size:12px;font-weight:900;letter-spacing:.6px;margin-bottom:var(--sp-2);animation:wtag 1.4s ease-in-out infinite}
@keyframes wtag{50%{box-shadow:0 0 18px 2px color-mix(in srgb,var(--accent-red) 70%,transparent)}}
.winc h4{margin:0 0 var(--sp-1);font-size:22px}
.winc .mut{color:var(--muted);font-size:13px}
.winc .mul{margin-top:var(--sp-3);padding:var(--sp-3) var(--sp-3);border-radius:var(--r-md);background:var(--page);box-shadow:inset 0 0 12px 4px var(--glow-blue)}
.winc .mul small{color:var(--muted);font-size:12px;display:block}
.winc .mul b{font-size:28px}
.winbt{display:grid;grid-template-columns:2fr 1fr;gap:var(--sp-2);margin-bottom:var(--sp-4)}
.winbt .b{height:48px;font-weight:700}
.wplayer{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);border-radius:var(--r-lg);background:var(--page);margin-bottom:var(--sp-3)}
.wplayer .ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#b39759,#6b5226);font-weight:800}
.wplayer b{display:block}
.wplayer small{color:#e3c27a;font-size:12px;font-weight:700}
.wnums{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);margin-bottom:var(--sp-3)}
.wnums div{padding:var(--sp-3) var(--sp-3);border-radius:var(--r-lg);background:var(--page)}
.wnums small{display:block;color:var(--muted);font-size:12px}
.wnums b{font-size:16px}
.wnums .pf{color:var(--accent-green)}
.wround{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-3) var(--sp-3);border-radius:var(--r-lg);background:var(--page);font-size:13px;color:var(--muted)}
.wround span{font-family:ui-monospace,monospace;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.wround button{color:#8fa0ff;display:grid;place-items:center}
.wround button svg{width:18px;height:18px}
/* акции */
.pchips{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin:0 var(--sp-4) var(--sp-6) 0}
.pchips button{height:38px;padding:0 var(--sp-4);border-radius:999px;background:var(--panel);font-weight:600;font-size:14px;color:var(--ink2);transition:background .2s,color .2s,box-shadow .2s}
.pchips button:hover{box-shadow:inset 0 0 10px 3px color-mix(in srgb,var(--glow-blue) 35%,transparent)}
.pchips button.on{background:var(--accent-red);color:#fff}
.psec{margin:0 var(--sp-4) var(--sp-8) 0}
.psec>h3{font-size:22px;margin:0 0 var(--sp-4)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:var(--card-gap)}
.pcard{position:relative;display:grid;grid-template-columns:1fr 120px;gap:var(--sp-4);align-items:center;min-height:170px;padding:var(--sp-6);border-radius:var(--r-lg);background:var(--panel);overflow:hidden;transition:box-shadow var(--glow-dur) cubic-bezier(.4,0,.2,1)}
.pcard:hover{box-shadow:inset 0 0 14px 5px color-mix(in srgb,var(--glow) 55%,transparent)}
.pcard.act{box-shadow:inset 0 0 14px 5px var(--glow-blue)}
.pcard h4{margin:0;font-size:20px}
.pcard .sub{color:var(--muted);font-size:14px;margin:var(--sp-0) 0 var(--sp-3)}
.pcard p{margin:0 0 var(--sp-4);font-size:13px;color:var(--ink2);max-width:330px}
.pcard .pic{font-size:78px;line-height:1;text-align:center;filter:drop-shadow(0 8px 20px color-mix(in srgb,var(--glow) 60%,transparent))}
.pcard .pic img{width:120px}
.pacts{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.pacts .b{height:38px;padding:0 var(--sp-4);font-weight:700;font-size:14px}
.ibtn{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--muted);color:var(--ink);font-weight:800;font-family:'Times New Roman',serif;font-style:italic}
.ibtn:hover{box-shadow:inset 0 0 0 1px #fff}
.ppr{flex:1;min-width:150px}
.ppr small{display:block;color:var(--muted);font-size:11px;margin-bottom:var(--sp-1)}
.ppr .bar{height:6px;border-radius:var(--r-xs);background:var(--line);overflow:hidden}
.ppr .bar i{display:block;height:100%;background:var(--accent-green);border-radius:var(--r-xs);transition:width .6s}
/* бонус-инфо */
.dlg.binfo{width:min(560px,100%)}
.bihd{position:relative;display:grid;grid-template-columns:1fr 120px;gap:var(--sp-3);align-items:center;padding:var(--sp-6) var(--sp-6) var(--sp-6);background:var(--bg);overflow:hidden}
.bihd h3{margin:0 0 var(--sp-4);font-size:28px;font-weight:800;line-height:1.05}
.bihd .pic{font-size:80px;text-align:center}
.bihd .pic img{width:110px}
.bihd .x{position:absolute;right:12px;top:12px}
.dlg.binfo .bd p{color:var(--ink2);font-size:14px;line-height:1.5;margin:0 0 var(--sp-3)}
.dlg.binfo .cta{display:flex;justify-content:center;margin:var(--sp-4) 0 var(--sp-6)}
.dlg.binfo .cta .b{min-width:200px;height:46px;font-weight:700}
.terms{list-style:none;margin:0;padding:0;counter-reset:t}
.terms li{counter-increment:t;display:flex;gap:var(--sp-3);margin-bottom:var(--sp-3);font-size:14px;line-height:1.45;color:var(--ink2)}
.terms li::before{content:counter(t);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--page);font-size:12px;font-weight:700;color:var(--muted)}
/* 404 */
.nf{position:relative;margin:0 var(--sp-4) var(--sp-6) 0;padding:var(--sp-16) var(--sp-6);border-radius:var(--r-xl);background:var(--panel);overflow:hidden;text-align:center}
.nf::after{content:"";position:absolute;left:50%;bottom:-160px;width:620px;height:300px;transform:translateX(-50%);background:radial-gradient(closest-side,color-mix(in srgb,var(--glow-blue) 70%,transparent),transparent);pointer-events:none}
.nf .n4{position:relative;z-index:1;font-size:clamp(96px,16vw,190px);font-weight:900;font-style:italic;line-height:.9;color:var(--accent-red);text-shadow:0 0 40px color-mix(in srgb,var(--accent-red) 60%,transparent);animation:n4 3s ease-in-out infinite}
@keyframes n4{50%{text-shadow:0 0 70px color-mix(in srgb,var(--accent-red) 85%,transparent)}}
.nf h2{position:relative;z-index:1;font-size:clamp(26px,3vw,34px);margin:var(--sp-3) 0 var(--sp-2)}
.nf p{position:relative;z-index:1;color:var(--muted);max-width:420px;margin:0 auto var(--sp-6);font-size:14px}
.nfb{position:relative;z-index:1;display:flex;gap:var(--sp-3);justify-content:center;flex-wrap:wrap}
.nfb .b{height:46px;padding:0 var(--sp-6);font-weight:700}
.oop{position:relative;display:grid;grid-template-columns:1fr auto;gap:var(--sp-8);align-items:center;margin:0 var(--sp-4) var(--sp-6) 0;padding:var(--sp-16) var(--sp-12);border-radius:var(--r-xl);background:var(--panel);overflow:hidden}
.oop::after{content:"";position:absolute;right:-120px;top:-160px;width:560px;height:560px;background:radial-gradient(closest-side,color-mix(in srgb,var(--glow-blue) 55%,transparent),transparent);pointer-events:none}
.oop .tg{display:inline-block;padding:var(--sp-1) var(--sp-3);border-radius:var(--r-sm);background:var(--accent-red);font-size:12px;font-weight:800;margin-bottom:var(--sp-3)}
.oop h2{font-size:clamp(28px,3.2vw,40px);margin:0 0 var(--sp-3)}
.oop p{color:var(--muted);max-width:420px;margin:0 0 var(--sp-6);font-size:14px}
.oop .nfb{justify-content:flex-start}
.digs{position:relative;z-index:1;display:flex;gap:var(--sp-3)}
.dig{width:clamp(70px,8vw,110px);height:clamp(100px,11vw,150px);border-radius:var(--r-lg);background:#05060f;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.dig.mid{box-shadow:inset 0 0 18px 6px var(--glow-blue),inset 0 0 0 1px var(--glow-blue)}
.dig .strip{display:flex;flex-direction:column;transition:transform 1.4s cubic-bezier(.2,.9,.25,1.12)}
.dig .strip b{flex:none;height:clamp(100px,11vw,150px);display:grid;place-items:center;font-size:clamp(60px,7vw,100px);font-weight:900;font-style:italic}
.dig.mid .strip b{color:var(--accent-red)}
.oopt{margin:0 var(--sp-4) var(--sp-3) 0;font-size:18px}
/* баннеры верификации */
#vban{position:fixed;z-index:60;top:calc(var(--hdr-h) + 12px);right:16px;width:min(720px,calc(100vw - 32px));display:flex;flex-direction:column;gap:var(--sp-2);pointer-events:none}
.vb{pointer-events:auto;display:flex;align-items:center;gap:var(--sp-3);min-height:50px;padding:var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-4);border-radius:var(--r-md);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:vbin .35s cubic-bezier(.2,.9,.3,1.2)}
.vb.out{animation:vbout .25s ease-in forwards}
@keyframes vbin{from{opacity:0;transform:translateY(-12px) scale(.98)}}
@keyframes vbout{to{opacity:0;transform:translateY(-10px)}}
.vb.ok{background:#14a35a}.vb.bad{background:var(--accent-red)}.vb.warn{background:#e8590c}.vb.info{background:#3b2fd9}
.vb .ic{font-size:18px;flex:none}
.vb .tx{flex:1;min-width:0;font-size:14px}
.vb .tx b{margin-right:var(--sp-2)}
.vb .tx span{opacity:.82}
.vb .ac{height:34px;padding:0 var(--sp-3);border-radius:var(--r-sm);background:rgba(255,255,255,.18);font-weight:700;font-size:13px;white-space:nowrap}
.vb .ac:hover{background:rgba(255,255,255,.3)}
.vb .cl{width:34px;height:34px;display:grid;place-items:center;font-size:18px;opacity:.8}
@media (max-width:900px){
 #bnav{grid-template-columns:repeat(6,1fr)!important}
 .gst .b{height:36px;padding:0 var(--sp-3);font-size:13px}
 .pcard{grid-template-columns:1fr 80px;padding:var(--sp-4);min-height:0}
 .pcard .pic{font-size:56px}.pcard .pic img{width:80px}
 .oop{grid-template-columns:1fr;padding:var(--sp-8) var(--sp-6);text-align:center}
 .oop p{margin-left:auto;margin-right:auto}.oop .nfb{justify-content:center}.digs{justify-content:center}
 .winc{grid-template-columns:110px 1fr}
 .wnums b{font-size:14px}
 #vban{top:calc(var(--hdr-h) + 8px);right:10px;width:calc(100vw - 20px)}
 .vb .tx span{display:block}
 .bihd h3{font-size:22px}
 .pchips,.psec,.nf,.oop,.oopt{margin-right:0}
}

.auth .row2>div,.auth .row3>div{min-width:0}
.wnums b{white-space:nowrap}
.dock button,#vmBtn{border-radius:var(--r-md)}

/* ===== радиусы по правилам =====
   шкала: xs 4 · sm 8 · md 12 (кнопки, поля, чипы) · lg 16 (карточки) · xl 24 (модалки, крупные блоки)
   вложенные: внутренний = внешний − отступ (концентрично) */
.seg2>button,.atabs>button{border-radius:calc(var(--r-md) - var(--sp-1))}
.inp .mini,.auth .inp .mini,.auth .inp .eye,.vb .ac{border-radius:var(--r-xs)}
.claim{border-radius:var(--r-xl)}
.mach>.b{border-radius:var(--r-sm)}
.list>.nav{border-radius:var(--r-lg)}
.selx select{border-radius:inherit}
.gp-tools{grid-template-columns:repeat(3,minmax(0,1fr))}
.gp-tools .b{min-width:0}
@media (max-width:900px){.gp-tools .b{padding:0 var(--sp-1);gap:var(--sp-1)}}
@media (max-width:900px){.gp{border-radius:var(--r-xl)}.gp>.mach,.gp>.slot{border-radius:var(--r-md)}}
@supports (corner-shape:squircle){
 :root{--r-xs:6px;--r-sm:11px;--r-md:16px;--r-lg:22px;--r-xl:33px;--radius:22px}
 *,*::before,*::after{corner-shape:superellipse(1.4)}
 */

.eb,.cabt .ci,.claim::before,.copy .age,.crest,.gt .ic,.okbox .big,.opt .rd,.opt small::before,.pchips button,.pdraw .ava,.pill::before,.pin i,.promo::before,.sw::after,.terms li::before,.wplayer .ava,[style*="border-radius:50%"]{corner-shape:round}
}

/* ===== Icon Motion: анимации иконок =====
   правила: 0.9 с · сжатие → движение → перелёт → расплющивание · без прозрачности (эффекты исчезают масштабом и толщиной) · без id */
.icm{overflow:visible}
.icm *{transform-box:fill-box;transform-origin:center}
.icm .fx{visibility:hidden}
.icm[data-m="reel"]{overflow:hidden}
.icm[data-m="reel"] .g{transform-box:view-box}
.icm[data-m="raise"] .g,.icm[data-m="bell"] .g,.icm[data-m="tag"] .g{transform-origin:50% 100%}
.icm[data-m="bell"] .g,.icm[data-m="tag"] .g{transform-origin:50% 8%}
.icm[data-m="blast"] .g{transform-origin:25% 55%}
.icm .shine{color:color-mix(in srgb,currentColor 25%,#fff);clip-path:polygon(-60% 0,-35% 0,-50% 100%,-75% 100%)}
.icm[data-m="pushR"]{--sx:1;--sy:0}.icm[data-m="pushL"]{--sx:-1;--sy:0}.icm[data-m="pushU"]{--sx:0;--sy:-1}.icm[data-m="pushD"]{--sx:0;--sy:1}

.icm.is-playing[data-m="boing"] .g{animation:icm-boing .9s both}
.icm.is-playing[data-m="heart"] .g{animation:icm-heart 1s ease-in-out both}
.icm.is-playing[data-m="reel"] .g{animation:icm-win 1s ease-out both}
.icm.is-playing[data-m="reel"] .reel{animation:icm-reel .9s cubic-bezier(.5,-.4,.25,1.3) both}
.icm.is-playing[data-m="flip"] .g{animation:icm-flip 1s linear both}
.icm.is-playing[data-m="deal"] .g,.icm.is-playing[data-m="tada"] .g{animation:icm-tada .9s ease-out both}
.icm.is-playing[data-m="raise"] .g{animation:icm-raise 1s linear both}
.icm.is-playing[data-m="raise"] .shine{animation:icm-shine 1s ease-in-out both}
.icm.is-playing[data-m="blast"] .g{animation:icm-blast 1s cubic-bezier(.3,1.2,.5,1) both}
.icm.is-playing[data-m="gift"] .g,.icm.is-playing[data-m="pop"] .g{animation:icm-pop .8s ease-out both}
.icm.is-playing[data-m="popin"] .g{animation:icm-popin .6s ease-out both}
.icm.is-playing[data-m="crown"] .g{animation:icm-crown .9s ease-out both}
.icm.is-playing[data-m="star"] .g{animation:icm-star .9s ease-out both}
.icm.is-playing[data-m="globe"] .g,.icm.is-playing[data-m="spin"] .g{animation:icm-spin .9s ease-out both}
.icm.is-playing[data-m="spinBack"] .g{animation:icm-spin .9s ease-out reverse both}
.icm.is-playing[data-m="spike"] .g{animation:icm-spike .9s ease-out both}
.icm.is-playing[data-m="bell"] .g,.icm.is-playing[data-m="tag"] .g{animation:icm-ringrot .9s ease-out both}
.icm.is-playing[data-m="nope"] .g{animation:icm-nope .6s ease-out both}
.icm.is-playing[data-m="hop"] .g{animation:icm-hop .7s ease-out both}
.icm.is-playing[data-m="jelly"] .g{animation:icm-jelly .8s ease-out both}
.icm.is-playing[data-m="beat"] .g{animation:icm-beat .8s ease-out both}
.icm.is-playing[data-m="blink"] .g{animation:icm-blink .6s ease-in-out both}
.icm.is-playing[data-m="scan"] .g{animation:icm-scan .8s ease-out both}
.icm.is-playing[data-m^="push"] .g{animation:icm-push .7s ease-out both}
.icm.is-playing[data-m="zap"] .g{animation:icm-nope .5s ease-out both}

.icm.is-playing .ring{animation:icm-fx-ring 1s cubic-bezier(.2,.6,.4,1) forwards;animation-delay:calc(var(--d) + .1s)}
.icm.is-playing .spark{animation:icm-fx-spark .6s ease-out forwards;animation-delay:var(--d)}
.icm.is-playing .wave{animation:icm-fx-wave .6s ease-out forwards;animation-delay:calc(var(--d) + .2s)}

@keyframes icm-boing{0%{transform:none;animation-timing-function:ease-out}14%{transform:scale(1.2,.76);animation-timing-function:cubic-bezier(.2,.8,.4,1)}38%{transform:translateY(-3px) scale(.86,1.16);animation-timing-function:cubic-bezier(.6,0,.9,.5)}56%{transform:translateY(0) scale(1.16,.84);animation-timing-function:ease-out}70%{transform:scale(.95,1.06)}84%{transform:scale(1.02,.98)}100%{transform:none}}
@keyframes icm-heart{0%{transform:none}12%{transform:scale(1.2)}22%{transform:scale(.94)}34%{transform:scale(1.14)}50%{transform:scale(.98)}100%{transform:none}}

@keyframes icm-win{0%{transform:none}12%{transform:scale(1.1,.85)}30%{transform:scale(.92,1.1)}80%{transform:none}88%{transform:scale(1.2,.85)}94%{transform:scale(.95,1.06)}100%{transform:none}}
@keyframes icm-flip{0%{transform:none;animation-timing-function:ease-out}12%{transform:scale(1.15,.8);animation-timing-function:ease-out}35%{transform:translateY(-5px) scale(.06,1.1)}50%{transform:translateY(-6px) scale(1,1)}65%{transform:translateY(-4px) scale(.06,1.1);animation-timing-function:ease-in}80%{transform:translateY(0) scale(1.15,.85);animation-timing-function:ease-out}90%{transform:scale(.96,1.04)}100%{transform:none}}
@keyframes icm-tada{0%{transform:none}10%,20%{transform:scale(.88) rotate(-4deg)}30%,50%,70%{transform:scale(1.15) rotate(8deg)}40%,60%{transform:scale(1.15) rotate(-8deg)}85%{transform:scale(.97)}100%{transform:none}}
@keyframes icm-raise{0%{transform:none;animation-timing-function:ease-out}14%{transform:scale(1.15,.82);animation-timing-function:cubic-bezier(.2,.8,.4,1)}35%{transform:translateY(-3px) scale(.92,1.12)}50%{transform:translateY(-3px) rotate(-8deg) scale(1.05)}64%{transform:translateY(-2px) rotate(6deg) scale(1.05)}80%{transform:translateY(0) scale(1.08,.92)}90%{transform:scale(.98,1.02)}100%{transform:none}}
@keyframes icm-shine{0%,30%{clip-path:polygon(-60% 0,-35% 0,-50% 100%,-75% 100%)}80%,100%{clip-path:polygon(135% 0,160% 0,145% 100%,120% 100%)}}
@keyframes icm-blast{0%{transform:none}25%{transform:translateX(-2px) scale(.88,1.04)}45%{transform:translateX(1.5px) scale(1.12,.94)}65%{transform:translateX(-.5px) scale(.97,1.02)}100%{transform:none}}
@keyframes icm-pop{0%{transform:none}20%{transform:scale(.72)}50%{transform:scale(1.28)}70%{transform:scale(.93)}85%{transform:scale(1.04)}100%{transform:none}}
@keyframes icm-popin{0%{transform:scale(0)}55%{transform:scale(1.35)}75%{transform:scale(.9)}100%{transform:none}}
@keyframes icm-crown{0%{transform:none}15%{transform:scale(1.15,.8)}40%{transform:translateY(-4px) rotate(-6deg) scale(.95,1.1)}60%{transform:translateY(-3px) rotate(6deg)}80%{transform:translateY(0) scale(1.1,.9)}100%{transform:none}}
@keyframes icm-star{0%{transform:none}15%{transform:scale(.7) rotate(-20deg)}60%{transform:scale(1.25) rotate(160deg)}80%{transform:scale(.95) rotate(144deg)}100%{transform:rotate(144deg)}}
@keyframes icm-spin{0%{transform:none}15%{transform:rotate(-30deg) scale(1.08,.9)}70%{transform:rotate(385deg) scale(.95,1.05)}85%{transform:rotate(352deg) scale(1.03)}100%{transform:rotate(360deg)}}
@keyframes icm-spike{0%{transform:none}20%{transform:translate(-1.5px,-2px) scale(.9)}40%{transform:translate(2px,2.5px) scale(1.2,.8) rotate(40deg)}60%{transform:translate(-.3px,-.3px) scale(.96,1.04) rotate(20deg)}80%{transform:rotate(5deg)}100%{transform:none}}
@keyframes icm-ringrot{0%{transform:none}10%{transform:rotate(18deg)}22%{transform:rotate(-16deg)}34%{transform:rotate(12deg)}46%{transform:rotate(-9deg)}58%{transform:rotate(6deg)}70%{transform:rotate(-3deg)}82%{transform:rotate(1deg)}100%{transform:none}}
