/* ===== Кошелёк (финтех) ===== */
.wl{--wl-pos:#2fd47a;--wl-neg:#ff6b6e;--wl-warn:#ffb347;--wl-info:#8fa0ff;max-width:var(--maxw);margin:0 var(--sp-4) var(--sp-8) 0;font-variant-numeric:tabular-nums}
.wl-nav{display:flex;gap:var(--sp-1);padding:var(--sp-1);background:var(--panel);border-radius:var(--r-lg);margin-bottom:var(--sp-6);width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.wl-nav::-webkit-scrollbar{display:none}
.wl-nav button{display:flex;align-items:center;gap:var(--sp-2);height:44px;padding:0 var(--sp-4);border-radius:var(--r-md);font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.wl-nav button svg{width:20px;height:20px}
.wl-nav button:hover{color:var(--ink)}
.wl-nav button.on{background:var(--card);color:#fff}
.wl-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--sp-4);align-items:start}
.wl-col{display:flex;flex-direction:column;gap:var(--sp-4);min-width:0}
.wl-card{background:var(--panel);border-radius:var(--r-lg);padding:var(--sp-6)}
.wl-card h3{margin:0 0 var(--sp-4);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.wl-card h3 .lnk{font-size:14px;font-weight:600;color:var(--wl-info)}
.wl-card h3 .lnk:hover{color:var(--ink)}
.wl-lbl{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:var(--sp-2)}
/* баланс */
.wl-bal{padding:var(--sp-8) var(--sp-6) var(--sp-6)}
.wl-big{font-size:clamp(40px,5.4vw,64px);font-weight:700;line-height:1;letter-spacing:-1.5px;margin:0 0 var(--sp-6)}
.wl-big small{font-size:.45em;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:var(--sp-1)}
.wl-split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2);margin-bottom:var(--sp-6)}
.wl-split div{padding:var(--sp-3) var(--sp-4);background:var(--page);border-radius:var(--r-md);min-width:0}
.wl-split small{display:flex;align-items:center;gap:var(--sp-2);color:var(--muted);font-size:12px;margin-bottom:var(--sp-1)}
.wl-split small i{width:8px;height:8px;border-radius:50%;flex:none}
.wl-split b{font-size:17px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2)}
.wl-act{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);height:52px;border-radius:var(--r-md);background:var(--card);font-weight:700;font-size:15px;transition:background .2s}
.wl-act:hover{background:var(--hov2)}
.wl-act.pri{background:var(--accent-red);color:#fff}
.wl-act.pri:hover{background:#ff5659}
.wl-act svg{width:20px;height:20px}
/* лента операций */
.wl-feed{display:flex;flex-direction:column}
.wl-day{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;padding:var(--sp-3) 0 var(--sp-2)}
.wl-day:first-child{padding-top:0}
.wl-op{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--sp-3);align-items:center;padding:var(--sp-2) 0}
.wl-op+.wl-op{border-top:1px solid var(--line)}
.wl-oi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink)}
.wl-oi svg{width:18px;height:18px}
.wl-oi.in{color:var(--wl-pos)}.wl-oi.out{color:var(--ink)}.wl-oi.bon{color:var(--wl-warn)}
.wl-op b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-op small{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-op .am{text-align:right;font-weight:700;font-size:15px;white-space:nowrap}
.wl-op .am.in{color:var(--wl-pos)}
.wl-op .am small{font-weight:500}
.wl-st{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:12px;font-weight:600}
.wl-st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.wl-st.ok{color:var(--wl-pos)}.wl-st.bad{color:var(--wl-neg)}.wl-st.wait{color:var(--wl-warn)}
/* отыгрыш */
.wl-wager{display:grid;grid-template-columns:112px minmax(0,1fr);gap:var(--sp-4);align-items:center}
.wl-ring{position:relative;width:112px;height:112px}
.wl-ring svg{width:112px;height:112px;transform:rotate(-90deg)}
.wl-ring circle{fill:none;stroke-width:10}
.wl-ring .bg{stroke:var(--page)}
.wl-ring .fg{stroke:var(--accent-red);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.wl-ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700}
.wl-wager b{display:block;font-size:20px;font-weight:700;margin-bottom:var(--sp-1)}
.wl-wager p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.wl-wager p strong{color:var(--ink);font-weight:600}
/* чек-лист */
.wl-check{display:flex;flex-direction:column;gap:var(--sp-2)}
.wl-ci{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:var(--sp-3);align-items:center;padding:var(--sp-3);background:var(--page);border-radius:var(--r-md)}
.wl-ci .ck{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--muted);font-weight:800;font-size:13px}
.wl-ci.ok .ck{background:var(--wl-pos);color:#06210f}
.wl-ci b{display:block;font-size:14px;font-weight:600}
.wl-ci small{color:var(--muted);font-size:12px}
.wl-mini{height:34px;padding:0 var(--sp-3);border-radius:var(--r-sm);background:var(--card);font-size:13px;font-weight:700;white-space:nowrap}
.wl-mini.pri{background:var(--accent-red);color:#fff}
.wl-bar{height:6px;border-radius:3px;background:var(--page);overflow:hidden;margin:var(--sp-2) 0 var(--sp-1)}
.wl-bar i{display:block;height:100%;background:var(--wl-info);border-radius:3px}
/* шапка сценария */
.wl-head{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.wl-back{width:44px;height:44px;flex:none;border-radius:var(--r-md);background:var(--panel);display:grid;place-items:center}
.wl-back svg{width:20px;height:20px}
.wl-head h2{margin:0;font-size:28px;font-weight:700}
.wl-head small{display:block;color:var(--muted);font-size:13px;font-weight:500}
/* сумма */
.wl-amt{display:flex;align-items:baseline;gap:var(--sp-2);padding:var(--sp-2) 0 var(--sp-3);border-bottom:2px solid var(--line);transition:border-color .2s}
.wl-amt:focus-within{border-color:var(--accent-red)}
.wl-amt.err{border-color:var(--wl-neg)}
.wl-amt span{font-size:40px;font-weight:700;color:var(--muted)}
.wl-amt input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font:700 56px/1 var(--font);letter-spacing:-1.5px;font-variant-numeric:tabular-nums;padding:0}
.wl-amt input::-webkit-outer-spin-button,.wl-amt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wl-amt input[type=number]{-moz-appearance:textfield}
.wl-amt em{font-style:normal;color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap}
.wl-hint{min-height:20px;margin:var(--sp-2) 0 var(--sp-3);font-size:13px;color:var(--muted)}
.wl-hint.err{color:var(--wl-neg)}
.wl-quick{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.wl-quick button{height:40px;padding:0 var(--sp-4);border-radius:999px;background:var(--card);font-weight:600;font-size:14px;transition:background .2s,color .2s}
.wl-quick button:hover{background:var(--hov2)}
.wl-quick button.on{background:#fff;color:#0b0f24}
/* способы */
.wl-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--sp-1);padding:var(--sp-1);background:var(--page);border-radius:var(--r-md);margin-bottom:var(--sp-3)}
.wl-seg button{height:40px;border-radius:var(--r-sm);font-weight:600;color:var(--muted);font-size:14px}
.wl-seg button.on{background:var(--card);color:#fff}
.wl-meths{display:flex;flex-direction:column;gap:var(--sp-2)}
.wl-m{display:grid;grid-template-columns:48px minmax(0,1fr) auto 20px;gap:var(--sp-3);align-items:center;min-height:64px;padding:var(--sp-2) var(--sp-4) var(--sp-2) var(--sp-2);background:var(--page);border-radius:var(--r-md);text-align:left;transition:background .2s}
.wl-m:hover{background:var(--hov1)}
.wl-m.on{background:var(--card)}
.wl-m b{display:block;font-size:15px;font-weight:600}
.wl-m small{color:var(--muted);font-size:12px}
.wl-m .eta{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}
.wl-m .eta b{font-size:13px;color:var(--ink);font-weight:600}
.wl-rd{width:20px;height:20px;box-sizing:border-box;border-radius:50%;border:2px solid var(--muted)}
.wl-m.on .wl-rd{border:6px solid var(--accent-red)}
.wl-logo{width:48px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;font-weight:900;font-size:12px;letter-spacing:.3px;color:var(--ink);gap:2px}
.wl-logo svg{width:16px;height:16px}
.wl-logo.visa{background:#1a1f71}.wl-logo.apple{background:#000;display:flex;justify-content:center}.wl-logo.gpay{background:#fff;color:#3c4043;display:flex;justify-content:center}.wl-logo.new{background:var(--card);font-size:20px;font-weight:600}
.wl-logo.bank{background:#00a3e0;font-size:10px}.wl-logo.usdt{background:#26a17b}
/* бонусы */
.wl-bons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2)}
.wl-bon{display:flex;flex-direction:column;gap:var(--sp-1);padding:var(--sp-4);background:var(--page);border-radius:var(--r-md);text-align:left;min-height:96px;transition:background .2s}
.wl-bon:hover{background:var(--hov1)}
.wl-bon.on{background:var(--card);outline:2px solid var(--accent-red);outline-offset:-2px}
.wl-bon b{font-size:15px;font-weight:700}
.wl-bon small{color:var(--muted);font-size:12px;line-height:1.35}
.wl-bon .tg{align-self:flex-start;margin-top:auto;padding:2px var(--sp-2);border-radius:var(--r-xs);background:var(--accent-red);color:#fff;font-size:11px;font-weight:700}
.wl-bon.dis{color:var(--muted)}
.wl-promo{display:flex;gap:var(--sp-2);margin-top:var(--sp-3)}
.wl-promo input{flex:1;min-width:0;height:44px;padding:0 var(--sp-4);background:var(--page);border:1px solid var(--line);border-radius:var(--r-md);color:var(--ink);font:600 15px var(--font);text-transform:uppercase;outline:none}
.wl-promo input:focus{border-color:var(--wl-info)}
.wl-plink{margin-top:var(--sp-3);font-size:14px;font-weight:600;color:var(--wl-info)}
/* итог */
.wl-sum{position:sticky;top:calc(var(--hdr-h) + var(--sp-4))}
.wl-rows{display:flex;flex-direction:column;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.wl-row{display:flex;justify-content:space-between;gap:var(--sp-3);font-size:14px;color:var(--muted)}
.wl-row b{color:var(--ink);font-weight:600;text-align:right}
.wl-row.pos b{color:var(--wl-pos)}
.wl-row.tot{padding-top:var(--sp-3);border-top:1px solid var(--line);font-size:15px;color:var(--ink)}
.wl-row.tot b{font-size:22px;font-weight:700}
.wl-cta{width:100%;height:56px;border-radius:var(--r-md);background:var(--accent-red);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:var(--sp-2);transition:background .2s}
.wl-cta:hover{background:#ff5659}
.wl-cta:disabled{background:var(--card);color:var(--muted);cursor:not-allowed}
.wl-sec{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);margin-top:var(--sp-3);color:var(--muted);font-size:12px}
.wl-sec svg{width:14px;height:14px}
/* крипта */
.wl-coins{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.wl-coin{display:flex;align-items:center;gap:var(--sp-2);height:40px;padding:0 var(--sp-3) 0 var(--sp-2);border-radius:999px;background:var(--page);font-weight:600;font-size:14px}
.wl-coin i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:var(--ink)}
.wl-coin.on{background:#fff;color:#0b0f24}
.wl-addr{display:grid;grid-template-columns:132px minmax(0,1fr);gap:var(--sp-4);align-items:center;padding:var(--sp-4);background:var(--page);border-radius:var(--r-md)}
.wl-addr .qr{width:132px;height:132px;padding:var(--sp-2);background:#fff;border-radius:var(--r-sm)}
.wl-addr code{display:block;font:600 13px/1.5 ui-monospace,Menlo,monospace;word-break:break-all;margin:var(--sp-1) 0 var(--sp-3)}
.wl-rate{display:flex;justify-content:space-between;gap:var(--sp-2);margin-top:var(--sp-3);font-size:13px;color:var(--muted)}
.wl-rate b{color:var(--ink);font-weight:600}
/* трекер */
.wl-track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-1);margin:var(--sp-3) 0 var(--sp-2)}
.wl-track i{height:4px;border-radius:2px;background:var(--card)}
.wl-track i.on{background:var(--wl-pos)}
.wl-track i.cur{background:var(--wl-warn)}
.wl-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-1);font-size:11px;color:var(--muted)}
.wl-steps span.on{color:#fff}
.wl-pend{padding:var(--sp-4);background:var(--page);border-radius:var(--r-md)}
.wl-pend+.wl-pend{margin-top:var(--sp-2)}
.wl-pend header{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-3)}
.wl-pend header b{display:block;font-size:15px}
.wl-pend header small{color:var(--muted);font-size:12px}
.wl-pend .am{font-weight:700;font-size:17px;white-space:nowrap}
.wl-pend footer{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);margin-top:var(--sp-3);font-size:12px;color:var(--muted)}
.wl-conf{display:flex;align-items:center;gap:var(--sp-3);margin-top:var(--sp-3);padding:var(--sp-3) var(--sp-4);background:var(--page);border-radius:var(--r-md);font-size:14px}
.wl-conf .sp{width:18px;height:18px;border-radius:50%;border:2px solid var(--card);border-top-color:var(--wl-warn);animation:wlsp .8s linear infinite;flex:none}
@keyframes wlsp{to{transform:rotate(360deg)}}
/* успех */
.wl-done{max-width:520px;margin:var(--sp-6) auto;text-align:center}
.wl-done .ok{width:88px;height:88px;margin:0 auto var(--sp-4);border-radius:50%;display:grid;place-items:center;background:var(--wl-pos);color:#06210f;animation:wlpop .6s cubic-bezier(.3,1.5,.5,1) both}
.wl-done .ok.wait{background:var(--wl-warn)}
.wl-done .ok svg{width:44px;height:44px}
@keyframes wlpop{0%{transform:scale(0)}100%{transform:none}}
.wl-done h2{margin:0 0 var(--sp-2);font-size:20px;font-weight:600;color:var(--muted)}
.wl-done .wl-big{margin-bottom:var(--sp-3)}
.wl-done p{margin:0 0 var(--sp-6);color:var(--muted)}
.wl-done p b{color:var(--ink)}
.wl-done .wl-acts{grid-template-columns:repeat(2,minmax(0,1fr))}
.wl-done .wl-card{text-align:left;margin-bottom:var(--sp-6)}
/* шторки */
.wl-proc{display:flex;flex-direction:column;gap:var(--sp-3);padding:var(--sp-2) 0}
.wl-proc div{display:flex;align-items:center;gap:var(--sp-3);color:var(--muted);font-weight:600}
.wl-proc div i{width:24px;height:24px;border-radius:50%;background:var(--card);flex:none;display:grid;place-items:center;font-style:normal;font-size:12px}
.wl-proc div.cur{color:#fff}.wl-proc div.cur i{border:2px solid var(--card);border-top-color:var(--wl-warn);background:none;animation:wlsp .8s linear infinite}
.wl-proc div.ok{color:#fff}.wl-proc div.ok i{background:var(--wl-pos);color:#06210f}
.wl-pinv{display:flex;justify-content:center;gap:var(--sp-3);margin:var(--sp-2) 0 var(--sp-6)}
.wl-pinv i{width:14px;height:14px;border-radius:50%;background:var(--card)}
.wl-pinv i.f{background:#fff}
.wl-pinv.shake{animation:icm-nope .5s}
.wl-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2)}
.wl-pad button{height:56px;border-radius:var(--r-md);background:var(--card);font-size:22px;font-weight:600}
.wl-pad button:active{background:var(--hov2)}
.wl-form{display:flex;flex-direction:column;gap:var(--sp-3)}
.wl-form label{display:flex;flex-direction:column;gap:var(--sp-2);font-size:13px;color:var(--muted);font-weight:600}
.wl-form input{height:48px;padding:0 var(--sp-4);background:var(--page);border:1px solid var(--line);border-radius:var(--r-md);color:var(--ink);font:600 16px var(--font);outline:none}
.wl-form input:focus{border-color:var(--wl-info)}
.wl-form input.err{border-color:var(--wl-neg)}
.wl-form .two{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.wl-ferr{min-height:18px;color:var(--wl-neg);font-size:13px}
.wl-legacy{background:var(--panel);border-radius:var(--r-lg);padding:var(--sp-6)}
.wl-sub{margin-bottom:var(--sp-4)}
@media (max-width:1100px){.wl-grid{grid-template-columns:minmax(0,1fr)}.wl-sum{position:static}.wl-bons{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
 .wl{margin-right:0}
 .wl-nav{width:auto}
 .wl-nav button{flex:1;justify-content:center;padding:0 var(--sp-2);font-size:14px}
 .wl-nav button svg{display:none}
 .wl-card,.wl-legacy{padding:var(--sp-4)}
 .wl-bal{padding:var(--sp-6) var(--sp-4) var(--sp-4)}
 .wl-split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .wl-split div:first-child{grid-column:1/-1}
 .wl-act{height:48px;font-size:14px;flex-direction:column;gap:2px;height:64px}
 .wl-amt input{font-size:44px}.wl-amt span{font-size:32px}
 .wl-addr{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
 .wl-m{grid-template-columns:44px minmax(0,1fr) 20px}.wl-m .eta{display:none}
 .wl-sum{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px) + var(--sp-2));top:auto;z-index:5;padding:var(--sp-3)}
 .wl-sum .wl-rows,.wl-sum h3,.wl-sum .wl-sec{display:none}
 .wl-sum .wl-rows.keep{display:flex;margin-bottom:var(--sp-3)}
 .wl-head h2{font-size:24px}
}

/* ===== Кошелёк, этап 2: история, ставки, аккаунт ===== */
button.wl-op{width:100%;text-align:left;border-radius:var(--r-sm);transition:background .15s}
button.wl-op:hover{background:var(--page)}
.wl-op .th{width:40px;height:40px;border-radius:var(--r-sm);object-fit:cover;background:var(--card)}
.hx-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:var(--sp-4);margin-bottom:var(--sp-4)}
.hx-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2)}
.hx-sum div{padding:var(--sp-3) var(--sp-4);background:var(--page);border-radius:var(--r-md);min-width:0}
.hx-sum small{display:block;color:var(--muted);font-size:12px;margin-bottom:var(--sp-1)}
.hx-sum b{display:block;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-sum b.in{color:var(--wl-pos)}
.hx-chart svg{width:100%;height:140px;display:block}
.hx-chart .in{fill:var(--wl-pos)}.hx-chart .out{fill:#e8eaf6}.hx-chart .base{stroke:var(--line);stroke-width:1}
.hx-chart text{fill:var(--muted);font:600 11px var(--font)}
.hx-leg{display:flex;gap:var(--sp-4);font-size:12px;color:var(--muted);margin-top:var(--sp-2)}
.hx-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:var(--sp-1)}
.hx-bar{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-4)}
.hx-bar .wl-quick{flex:1;min-width:0}
.hx-bar .wl-seg{margin:0;width:auto}
.hx-bar .wl-seg button{padding:0 var(--sp-3)}
.hx-q{display:flex;align-items:center;gap:var(--sp-2);height:40px;padding:0 var(--sp-3);background:var(--page);border:1px solid var(--line);border-radius:var(--r-md);min-width:200px}
.hx-q svg{width:18px;height:18px;color:var(--muted);flex:none}
.hx-q input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font:600 14px var(--font)}
.hx-q:focus-within{border-color:var(--wl-info)}
.hx-more{width:100%;height:44px;margin-top:var(--sp-3);border-radius:var(--r-md);background:var(--card);font-weight:600}
.hx-empty{padding:var(--sp-8) var(--sp-4);text-align:center;color:var(--muted)}
.hx-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:var(--sp-1)}
.rc{display:flex;flex-direction:column;gap:var(--sp-3)}
.rc-amt{text-align:center;padding:var(--sp-2) 0 var(--sp-4)}
.rc-amt b{display:block;font-size:40px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.rc-amt b.in{color:var(--wl-pos)}
.rc-id{display:flex;align-items:center;gap:var(--sp-2);font:600 12px ui-monospace,Menlo,monospace}
/* ставки */
.bx-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-2);margin-bottom:var(--sp-4)}
.bx-sum div{padding:var(--sp-4);background:var(--panel);border-radius:var(--r-lg);min-width:0}
.bx-sum small{display:block;color:var(--muted);font-size:12px;margin-bottom:var(--sp-1)}
.bx-sum b{display:block;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx-sum b.in{color:var(--wl-pos)}.bx-sum b.out{color:var(--wl-neg)}
.bx-slips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:var(--sp-4)}
.sl{background:var(--panel);border-radius:var(--r-lg);padding:var(--sp-4) var(--sp-4) var(--sp-4)}
.sl header{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.sl header b{font-size:15px}
.sl header small{color:var(--muted);font-size:12px;display:block}
.sl-pill{height:24px;padding:0 var(--sp-2);border-radius:var(--r-sm);display:inline-flex;align-items:center;font-size:12px;font-weight:700;background:var(--page)}
.sl-pill.act{color:var(--wl-info)}.sl-pill.won{color:var(--wl-pos)}.sl-pill.lost{color:var(--wl-neg)}.sl-pill.cash{color:var(--wl-warn)}
.sl-sel{display:flex;flex-direction:column;gap:var(--sp-1);margin-bottom:var(--sp-3)}
.sl-sel div{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:var(--sp-2);align-items:center;padding:var(--sp-2) var(--sp-3);background:var(--page);border-radius:var(--r-sm);font-size:13px}
.sl-sel div i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;background:var(--card);color:var(--muted)}
.sl-sel div i.ok{background:var(--wl-pos);color:#06210f}.sl-sel div i.no{background:var(--wl-neg);color:#2a0606}
.sl-sel span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-sel span small{color:var(--muted)}
.sl-sel b{font-variant-numeric:tabular-nums}
.sl-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2);margin-bottom:var(--sp-3)}
.sl-nums small{display:block;color:var(--muted);font-size:11px}
.sl-nums b{font-size:15px;font-variant-numeric:tabular-nums}
.sl-cash{padding:var(--sp-3);background:var(--page);border-radius:var(--r-md)}
.sl-cash .sl-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:var(--sp-2)}
.sl-cash .sl-top b{color:var(--ink);font-size:15px}
.sl-cash input[type=range]{width:100%;accent-color:var(--accent-red);margin:0 0 var(--sp-3)}
.sl-cash .wl-cta{height:44px;font-size:14px}
/* аккаунт */
.ax-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--sp-4);align-items:start}
.ax-col{display:flex;flex-direction:column;gap:var(--sp-4);min-width:0}
.ax-me{display:flex;align-items:center;gap:var(--sp-4)}
.ax-ava{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent-red);font-size:26px;font-weight:800;flex:none}
.ax-me b{display:block;font-size:22px}
.ax-me small{display:flex;align-items:center;gap:var(--sp-2);color:var(--muted);font-size:13px;flex-wrap:wrap}
.ax-me .chip{padding:2px var(--sp-2);border-radius:var(--r-xs);background:#c0c4d6;color:#11162e;font-size:11px;font-weight:800}
.ax-list{display:flex;flex-direction:column}
.ax-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp-3);align-items:center;padding:var(--sp-3) 0}
.ax-row+.ax-row{border-top:1px solid var(--line)}
.ax-row small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.ax-row b{display:flex;align-items:center;gap:var(--sp-2);font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ax-row .r{display:flex;align-items:center;gap:var(--sp-2)}
.ax-score{display:flex;align-items:center;gap:var(--sp-4);margin-bottom:var(--sp-4)}
.ax-score b{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.ax-score small{display:block;color:var(--muted);font-size:13px}
.ax-segs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--sp-1);flex:1}
.ax-segs i{height:8px;border-radius:4px;background:var(--page)}
.ax-segs i.on{background:var(--wl-pos)}
.ax-sw{width:48px;height:28px;border-radius:14px;background:var(--card);position:relative;flex:none;transition:background .2s}
.ax-sw::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.ax-sw.on{background:var(--wl-pos)}
.ax-sw.on::after{transform:translateX(20px)}
.ax-dev{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--sp-3);align-items:center;padding:var(--sp-3) 0}
.ax-dev+.ax-dev{border-top:1px solid var(--line)}
.ax-dev .ic{width:40px;height:40px;border-radius:var(--r-sm);background:var(--page);display:grid;place-items:center}
.ax-dev .ic svg{width:20px;height:20px}
.ax-dev b{display:block;font-size:14px}
.ax-dev small{color:var(--muted);font-size:12px}
.ax-dev .now{color:var(--wl-pos);font-size:12px;font-weight:700}
.ax-danger{color:var(--wl-neg)}
.lm-row{padding:var(--sp-3) 0}
.lm-row+.lm-row{border-top:1px solid var(--line)}
.lm-row .t{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3)}
.lm-row .t b{font-size:15px;font-weight:600}
.lm-row .t small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.lm-row .wl-bar{margin-bottom:var(--sp-1)}
.lm-row .wl-bar i.hi{background:var(--wl-warn)}
.lm-note{font-size:12px;color:var(--wl-warn)}
.lm-intro{margin:0 0 var(--sp-4);color:var(--ink2);font-size:14px;max-width:65ch}
.lm-opts{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-3)}
.lm-help{display:flex;gap:var(--sp-3);align-items:flex-start;font-size:13px;color:var(--ink2)}
.lm-help a{color:var(--wl-info);font-weight:600}
.ax-pause{padding:var(--sp-4);background:var(--page);border-radius:var(--r-md);margin-bottom:var(--sp-4)}
.ax-pause b{display:block;color:var(--wl-warn)}
.ax-pause small{color:var(--muted)}
@media (max-width:1100px){.hx-top,.ax-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
 .bx-sum{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .hx-q{min-width:0;flex:1 1 100%}
 .hx-sum{grid-template-columns:minmax(0,1fr)}
 .hx-sum div{display:flex;justify-content:space-between;align-items:baseline}
 .hx-sum small{margin:0}
 .hx-sum b{font-size:16px}
 .hx-bar .wl-seg{flex:1 1 100%}
}

:root{--ink:#ffffff;--ink2:#c9cce6;--hov1:#0d1230;--hov2:#2c3252}
html[data-ui="light"]{--page:#eef0f6;--panel:#ffffff;--card:#e4e7f0;--text:#11162e;--muted:#5f6688;--line:#e0e3ec;--hdr-bg:#ffffff;--side-bg:#ffffff;--nav-bg:#f4f5f9;--nav-color:#11162e;--nav-icon-color:#7a809f;--bal-bg:#eef0f6;--search-border:#c5c9db;--digit-bg:#ffffff;--btn-border-color:#11162e;--allg-border:#11162e;--st-bg:#ffffff;--tile-bg:#ffffff;--box-bg:#ffffff;--timer-bg:#e4e7f0;--promo-bg:#ffffff;--ink:#11162e;--ink2:#3a4060;--hov1:#e9ecf4;--hov2:#d9dde9;color-scheme:light}
html[data-ui="light"] body{background:var(--page);color:var(--ink)}
.hero,html[data-ui="light"] .hero{background:none}
.slide{background:#090d20}
html[data-ui="light"] .b-ghost,html[data-ui="light"] .wl-nav button.on,html[data-ui="light"] .wl-steps span.on,html[data-ui="light"] .wl-seg button.on,html[data-ui="light"] .wl-proc div.ok,html[data-ui="light"] .wl-proc div.cur,html[data-ui="light"] .wl-ci b,html[data-ui="light"] .hx-q input,html[data-ui="light"] .wl-promo input,html[data-ui="light"] .wl-form input,html[data-ui="light"] .auth .inp input{color:var(--ink)}
html[data-ui="light"] .wl-quick button.on,html[data-ui="light"] .wl-coin.on{background:var(--ink);color:#fff}
html[data-ui="light"] .wl-m:hover,html[data-ui="light"] .wl-bon:hover{background:var(--hov1)}
html[data-ui="light"] .wl-logo.gpay{box-shadow:none;outline:1px solid var(--line)}
html[data-ui="light"] .modes .b:not(.b-red){color:var(--ink)}
:root{--tab-h:48px;--tab-fs:17px}
.side-tg{display:none!important}
@media (min-width:901px){#hdr .burger{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-md);transition:background .2s}#hdr .burger:hover{background:var(--card)}#hdr .burger svg path{stroke:var(--ink)}#hdr .crown{left:calc(var(--crown-x) + 68px)}}
body.side-mini .modes{height:auto}
body.side-mini .modes .b{flex:none}
html[data-ui="light"] .socials button:last-child svg{fill:var(--ink)}
body.side-mini .modes .b{height:48px}
.st-pl{white-space:nowrap}

/* слайдер растёт при свёрнутом меню, углы и превью */
:root{--maxw:1252px}
body.side-mini{--maxw:1424px}
.hero{clip-path:inset(0 round var(--hero-radius));transition:height .25s cubic-bezier(.3,.8,.3,1)}
.slide{transition:transform var(--slide-dur) cubic-bezier(.7,0,.2,1),clip-path var(--peek-dur) var(--peek-ease);clip-path:inset(0 0 0 0 round calc(var(--hero-radius) / var(--hs,1)))}
.hero.peeking .slide.on{clip-path:inset(0 calc(var(--peek-w) + var(--peek-gap)) 0 0 round calc(var(--hero-radius) / var(--hs,1)))}
.hero.peeking-l .slide.on{clip-path:inset(0 0 0 calc(var(--peek-w) + var(--peek-gap)) round calc(var(--hero-radius) / var(--hs,1)))}
.peek{background:transparent;transform:translate3d(100%,0,0);backface-visibility:hidden}
.hero.peeking .peek:not(.peek-l),.hero.peeking-l .peek-l{transform:translate3d(0,0,0)}
.peek-l{transform:translate3d(-100%,0,0)}
.peek-in{border-radius:calc(var(--hero-radius) / var(--hs,1))}
/* плитки разделов: крупные иконки, обрезанные краем */
.tile{position:relative;overflow:hidden}
.tile>div,.tile>span:not(.ic){position:relative;z-index:1}
.tile .ic{position:absolute;right:-18px;top:50%;width:96px;height:96px;transform:translateY(-50%) rotate(-14deg);color:color-mix(in srgb,var(--muted) 40%,var(--tile-bg));transition:color .25s,transform .4s cubic-bezier(.3,1.4,.5,1)}
.tile:hover .ic{color:var(--accent-red);transform:translateY(-50%) rotate(-4deg) scale(1.06)}
/* глаз баланса */
.icm .slash,.icm .slash-gap{stroke-dashoffset:0}
.icm.is-playing[data-m="eyeHide"] .lid{animation:icm-eyeblink .9s ease-in-out both}
.icm.is-playing[data-m="eyeHide"] .slash,.icm.is-playing[data-m="eyeHide"] .slash-gap{animation:icm-slash .9s cubic-bezier(.6,0,.2,1) both}
.icm.is-playing[data-m="eyeShow"] .pupil{animation:icm-look .9s cubic-bezier(.5,0,.3,1) both}
.icm.is-playing[data-m="eyeShow"] .lid{animation:icm-eyeopen .9s ease-out both}
@keyframes icm-slash{0%{stroke-dashoffset:0}30%,50%{stroke-dashoffset:-1.15}50.01%{stroke-dashoffset:1.15}100%{stroke-dashoffset:0}}
@keyframes icm-eyeblink{0%,25%{transform:none}38%{transform:scaleY(.08)}50%{transform:scaleY(1.06)}62%,100%{transform:none}}
@keyframes icm-eyeopen{0%{transform:scaleY(.1)}25%{transform:scaleY(1.12)}40%,100%{transform:none}}
@keyframes icm-look{0%,20%{transform:none}38%{transform:translateX(-2.6px)}62%{transform:translateX(2.6px)}80%{transform:translateX(-.6px)}100%{transform:none}}
/* кнопка сворачивания меню и выбор набора иконок */
.bg-d{display:none}
@media (min-width:901px){#hdr .burger{background:var(--bal-bg)}#hdr .burger:hover{background:var(--card)}#hdr .burger .bg-m{display:none}#hdr .burger .bg-d{display:grid;place-items:center;color:var(--ink)}}
.bg-d svg{width:22px;height:22px;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
body.side-mini .bg-d svg{transform:scaleX(-1)}
#hdr .burger:hover .bg-d svg{transform:translateX(-2px)}
body.side-mini #hdr .burger:hover .bg-d svg{transform:scaleX(-1) translateX(-2px)}
html[data-icons="soft"] svg[stroke-width="2"]{stroke-width:2.3}
#icBtn{height:32px;padding:0 var(--sp-3);border-radius:var(--r-md);background:var(--panel);color:var(--ink);border:1px solid var(--line);font:600 12px var(--font);cursor:pointer}
body.side-mini #icBtn{display:none!important}
/* VIP пока убран */
#hdr .vip,#hdr .crown,#pop [data-go="vip"],.pdraw [data-go="vip"]{display:none!important}
/* выпадающие списки в стиле сайта */
.inp select,.wl-form select,.auth select{appearance:none;-webkit-appearance:none;cursor:pointer}
.inp:has(select){position:relative}
.inp:has(select)::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;margin-top:-6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none;transition:transform .2s}
select.cs-open{outline:none}
.selx:has(select.cs-open)::after,.inp:has(select.cs-open)::after{transform:rotate(225deg);margin-top:-2px}
.selx:has(select.cs-open),.inp:has(select.cs-open){border-color:var(--wl-info,#8fa0ff)}
#csPop{position:fixed;z-index:90;min-width:180px;max-height:min(340px,60vh);overflow:auto;padding:var(--sp-1);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top center;transition:transform .18s cubic-bezier(.3,1.3,.5,1),visibility 0s .18s;scrollbar-width:thin}
#csPop.on{visibility:visible;transform:none;transition:transform .22s cubic-bezier(.3,1.3,.5,1),visibility 0s}
#csPop.up{transform-origin:bottom center}
#csPop button{display:flex;align-items:center;gap:var(--sp-2);width:100%;min-height:40px;padding:0 var(--sp-3);border-radius:var(--r-sm);text-align:left;font:500 15px var(--font);color:var(--ink)}
#csPop button:hover,#csPop button.hl{background:var(--card)}
#csPop button.sel{color:var(--accent-red);font-weight:700}
#csPop button i{width:16px;flex:none;display:grid;place-items:center}
#csPop button i svg{width:16px;height:16px}
#csPop .cs-ph{color:var(--muted)}
.pop button svg,.pdraw .lst button svg{width:24px!important;height:24px!important;flex:none}
/* скользящий маркер активного пункта меню */
.side-in{position:sticky}
.nav-ind{position:absolute;left:0;top:0;z-index:1;pointer-events:none;border-radius:var(--r-lg);box-shadow:inset 0 0 12px 5px var(--nav-active-glow);visibility:hidden;transition:transform .5s cubic-bezier(.3,1.25,.4,1),width .3s,height .3s}
.nav-ind.on{visibility:visible}
.nav-ind.jump{transition:none}
.side .nav{position:relative;z-index:2}
.side .nav.on,.side .nav.on:hover{box-shadow:none;background:none}
.side .nav.on .ic{transition:color .3s .15s}
/* лиги: свои иконки и ровные строки */
.chipcard{justify-content:flex-start;padding:var(--sp-4) var(--sp-2) 0;height:112px;gap:var(--sp-2)}
.chipcard i{width:32px;height:32px;flex:none;display:grid;place-items:center;color:var(--muted);transition:color .25s}
.chipcard i svg{width:32px;height:32px}
.chipcard:hover i{color:var(--accent-red)}
.chipcard span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;line-height:1.25;font-size:12px;font-weight:600}
/* шапка: депозит рядом с профилем, единые отступы */
#hdr .search{display:none!important}
.top{--hdr-gap:var(--sp-3)}
#hdr .logo{margin-right:var(--sp-3)}
#hdr .sp-mob{margin-right:var(--sp-3)}
.sp-mob{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-md);background:var(--bal-bg);color:var(--ink);flex:none;transition:background .2s}.sp-mob:hover{background:var(--card)}.sp-mob svg{width:22px;height:22px}body.search-open .sp-mob{background:var(--accent-red);color:#fff}
@media (max-width:900px){.top{--hdr-gap:var(--sp-2)}#hdr .bal>button{display:none}#hdr .logo{margin-right:0}#hdr .me{display:none}#hdr .sp-mob{margin-left:auto}.sp-mob{width:40px;height:40px}.sp-mob svg{width:20px;height:20px}#hdr .sp-mob{margin-right:0}}
/* поиск в боковом меню */
.side-search{display:flex;align-items:center;gap:var(--sp-2);width:100%;height:44px;padding:0 var(--sp-3);border-radius:var(--r-md);background:var(--nav-bg);border:1px solid var(--line);color:var(--muted);font:500 15px var(--font);text-align:left;transition:border-color .2s,color .2s}
.side-search:hover{border-color:var(--muted);color:var(--ink)}
.side-search .ic{width:20px;height:20px;flex:none;display:grid;place-items:center}
.side-search .ic svg{width:20px;height:20px}
.side-search .t{flex:1}
.side-search kbd{font:600 11px var(--font);padding:2px 6px;border-radius:var(--r-xs);background:var(--card);color:var(--muted)}
body.search-open .side-search{border-color:var(--accent-red);color:var(--ink)}
body.side-mini .side-search{justify-content:center;padding:0}
body.side-mini .side-search .t,body.side-mini .side-search kbd{display:none}
/* панель поиска над контентом */
.maincol{min-width:0;display:flex;flex-direction:column}
#sp{display:grid;grid-template-rows:0fr;padding:0 var(--sp-4) 0 var(--sp-4);transition:grid-template-rows .45s cubic-bezier(.3,.9,.3,1)}
#sp.on{grid-template-rows:1fr}
.sp-in{overflow:hidden;min-height:0}
.sp-card{max-width:var(--maxw);margin-top:var(--sp-4);padding:var(--sp-6);background:var(--panel);border-radius:var(--r-xl);transform:translateY(-12px);transition:transform .45s cubic-bezier(.3,1.2,.4,1)}
#sp.on .sp-card{transform:none}
.sp-bar{display:flex;align-items:center;gap:var(--sp-3);height:56px;padding:0 var(--sp-2) 0 var(--sp-4);border-radius:var(--r-md);background:var(--page);border:1px solid var(--line)}
.sp-bar:focus-within{border-color:var(--accent-red)}
.sp-bar .ic{width:24px;height:24px;color:var(--muted);flex:none;display:grid;place-items:center}
.sp-bar .ic svg{width:24px;height:24px}
.sp-bar input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;color:var(--ink);font:600 20px var(--font)}
.sp-bar input::placeholder{color:var(--muted);font-weight:500}
.sp-clear,.sp-close{height:40px;padding:0 var(--sp-3);border-radius:var(--r-sm);background:var(--card);color:var(--muted);font:600 13px var(--font);flex:none}
.sp-clear:hover,.sp-close:hover{color:var(--ink)}
.sp-sec{margin-top:var(--sp-6)}
.sp-sec h4{margin:0 0 var(--sp-3);font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.sp-chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.sp-chips button{height:36px;padding:0 var(--sp-4);border-radius:999px;background:var(--card);color:var(--ink);font:600 14px var(--font);transition:background .2s}
.sp-chips button:hover{background:var(--accent-red);color:#fff}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--card-gap)}
.sp-empty{padding:var(--sp-8) 0;text-align:center;color:var(--muted)}
.sp-empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:var(--sp-1)}
@media (max-width:900px){#sp{padding:0 var(--sp-3)}.sp-card{padding:var(--sp-4);margin-top:var(--sp-3)}.sp-bar input{font-size:17px}.sp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sp-close{padding:0 var(--sp-2)}}
.slide h1,.peek-t{font-family:"Space Grotesk","Google Sans Flex",system-ui,sans-serif!important}
.slide h1{font-weight:700;letter-spacing:-.03em}
/* избранное на карточке: круглая плашка, закрывает звезду на обложке */
.slot .fav{right:8px;top:8px;width:32px;height:32px;border-radius:50%;background:#0b0f24;color:#fff;corner-shape:round}
.slot .fav svg{width:18px;height:18px}
/* заголовки секций жирнее */
.sec-h h2{font-weight:700}
/* лента слайдера: превью = маска соседнего слайда */
.peek,.hero.peeking .peek:not(.peek-l),.hero.peeking-l .peek-l{background:none!important}
.peek-in{display:none}
.slide .pk-t{position:absolute;top:var(--peek-ty);z-index:3;pointer-events:none}
.slide .pk-r{left:var(--peek-tx);transform:translateX(40px)}
.slide .pk-l{left:calc(1252px - var(--peek-w) + var(--peek-tx));transform:translateX(-40px)}
.hero.peeking .slide.nx .pk-r,.hero.peeking-l .slide.pv .pk-l{transform:none;opacity:1;transition:transform .7s cubic-bezier(.34,1.4,.64,1) .12s,opacity .3s ease .12s}
.slide.nx h1,.slide.pv h1,.slide.nx .b-cta,.slide.pv .b-cta{opacity:0}
.slide.on h1{opacity:1;transition:translate var(--peek-dur) var(--peek-ease),opacity .3s calc(var(--slide-dur) * .35)}
.slide.on .b-cta{opacity:1;transition:transform .9s cubic-bezier(.34,1.4,.64,1) calc(var(--slide-dur) * .4 + var(--i) * var(--text-stagger)),box-shadow var(--glow-dur) cubic-bezier(.4,0,.2,1),translate var(--peek-dur) var(--peek-ease),opacity .3s calc(var(--slide-dur) * .35)}
.slide.prep .b-cta,.slide.prep h1,.slide.intro .b-cta{transition:none}
/* Big Win: лента уходит под красный блок */
.bigwin{position:relative}
.bw-r{overflow:hidden;border-radius:var(--r-lg)}
.bw-t{display:flex;gap:var(--card-gap);will-change:transform}
.bw-t .wcard{animation:none}
.wcard b{white-space:nowrap}
.bw-l b{font:700 46px/1 "Space Grotesk","Google Sans Flex",system-ui,sans-serif;letter-spacing:-.03em}
@media (min-width:901px){
 .bigwin>.bw-l{grid-area:1/1;z-index:2;outline:0}
 .bigwin>.bw-r{grid-area:1/1/2/3;border-radius:0 var(--r-lg) var(--r-lg) 0}
 .bigwin>.bw-r{-webkit-mask-image:linear-gradient(90deg,transparent calc(var(--bwl,420px) - 16px),#000 calc(var(--bwl,420px) + 120px));mask-image:linear-gradient(90deg,transparent calc(var(--bwl,420px) - 16px),#000 calc(var(--bwl,420px) + 120px))}
}
@media (max-width:900px){.bw-r{overflow:hidden}}
/* шапка: единый шаг 12px между всеми блоками справа, все блоки 44px */
#hdr .sp-mob{margin-right:0}
#hdr .me{gap:var(--sp-3)}
#hdr .bell{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-md);background:var(--bal-bg);color:var(--ink);transition:background .2s}
#hdr .bell:hover{background:var(--card)}
@media (min-width:901px){#hdr .wallet{height:44px}#hdr .me>span:last-child{width:44px;height:44px}}
#hdr .bell>span{display:grid;place-items:center;width:24px;height:24px}
#hdr .bell>span svg{width:24px;height:24px}
#hdr .bell i{left:auto;right:10px;top:9px;width:10px;height:10px;border:2px solid var(--bal-bg)}
/* Casino/Sport: неактивная — без свечения, свечение только при наведении, активная — красная */
.modes .b.b-ghost{background:var(--nav-bg);box-shadow:inset 0 0 var(--btn-glow-blur) var(--btn-glow-spread) color-mix(in srgb,var(--glow-blue) 0%,transparent)}
.modes .b.b-ghost:hover,.modes .b.b-ghost:focus-visible{box-shadow:inset 0 0 var(--btn-glow-blur) var(--btn-glow-spread) var(--glow-blue)}
/* аватар пользователя */
#hdr .me>span:last-child,#bnav [data-a="profile"] .ic{border-radius:50%}
html.has-ava #hdr .me>span:last-child,html.has-ava #bnav [data-a="profile"] .ic,html.has-ava .ax-ava,html.has-ava .pdraw .who .ava{background:var(--ava) center/cover no-repeat!important;color:transparent!important;font-size:0!important}
html.has-ava #hdr .me>span:last-child>*,html.has-ava #bnav [data-a="profile"] .ic>*{visibility:hidden}
.ax-ava{position:relative;cursor:pointer;color:#fff}
.ax-ava i{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--panel);border:2px solid var(--panel);font-size:0}
html.has-ava .ax-ava i{color:var(--panel)!important}
.ax-ava i svg{width:12px;height:12px}
.pdraw .who .ava{cursor:pointer}
.pe{display:flex;flex-direction:column}
.pe-crop,.ax-ava,.ax-ava i,.pdraw .ava,#hdr .me>span:last-child,#bnav [data-a="profile"] .ic{corner-shape:round}
.pe-crop{position:relative;width:240px;height:240px;margin:0 auto var(--sp-4);border-radius:50%;overflow:hidden;background:var(--accent-red);touch-action:none;outline:none}
.pe-crop:focus-visible{outline:2px solid var(--wl-info);outline-offset:3px}
.pe-crop.has{background:var(--page);cursor:grab}.pe-crop.drag{cursor:grabbing}
.pe-ini{position:absolute;inset:0;display:grid;place-items:center;font:700 96px/1 "Space Grotesk",var(--font);color:#fff}
.pe-crop.has .pe-ini{display:none}
.pe-crop img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center;user-select:none;pointer-events:none;display:none}
.pe-crop.has img{display:block}
.pe-zoom{display:flex;align-items:center;gap:var(--sp-3);max-width:320px;width:100%;margin:0 auto}
.pe-zoom span{display:grid;place-items:center;color:var(--muted);flex:none}
.pe-zoom .rng{margin:0}
.pe-crop:not(.has)~.pe-zoom{pointer-events:none;color:var(--muted)}
.pe-crop:not(.has)~.pe-zoom .rng{filter:grayscale(1)}
.pe-tip{display:block;text-align:center;color:var(--muted);font-size:12px;margin:var(--sp-2) 0 var(--sp-4)}
.pe-btns{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);margin-bottom:var(--sp-6)}
.pe-btns .b{height:44px;gap:var(--sp-2)}.pe-btns svg{width:18px;height:18px}
.pe-up{cursor:pointer}
.pe-btns .b[disabled]{color:var(--muted);cursor:default}
.inp.bad{border-color:var(--wl-neg)}
.pe-hint{display:block;color:var(--muted);font-size:12px;margin:calc(var(--sp-2) * -1) 0 var(--sp-6)}
.pe-hint.bad{color:var(--wl-neg)}
.pe-act{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.pe-act .b{height:48px}
/* сегменты и вкладки: подложка активного пункта переезжает */
.wl-nav,.wl-seg{position:relative}
.seg-ind{position:absolute;left:0;top:0;width:0;height:0;border-radius:var(--r-md);background:var(--card);pointer-events:none;z-index:0;visibility:hidden;
 transition:transform .42s cubic-bezier(.3,1.2,.5,1),width .42s cubic-bezier(.3,1.2,.5,1),height .3s ease}
.wl-seg .seg-ind{border-radius:var(--r-sm)}
.has-ind>button{position:relative;z-index:1}
.has-ind>button.on{background:transparent!important}
.tabs,.chips2,.seg,.atabs{position:relative}
.has-ind.red>.seg-ind{background:var(--accent-red);border-radius:var(--r-md)}
.atabs>.seg-ind{background:var(--accent-red);border-radius:calc(var(--r-md) - var(--sp-1))}
.has-ind.red>button.b-red,.has-ind.red>button.b-green{background:transparent!important;box-shadow:none!important}
.has-ind.red>button{transition:color .25s,box-shadow var(--glow-dur) cubic-bezier(.4,0,.2,1)}
/* подпись превью слайдера: появляется и уходит шторкой, без растворения */
.slide .pk-t{opacity:1!important;clip-path:inset(0 100% 0 0);transform:translateX(-24px)!important;transition:clip-path .32s cubic-bezier(.5,0,.75,0),transform .32s cubic-bezier(.5,0,.75,0)!important}
.slide .pk-l{clip-path:inset(0 0 0 100%);transform:translateX(24px)!important}
.hero.peeking .slide.nx .pk-r,.hero.peeking-l .slide.pv .pk-l{clip-path:inset(0 0 0 0);transform:none!important;transition:clip-path .5s cubic-bezier(.2,.8,.2,1) .12s,transform .7s cubic-bezier(.34,1.4,.64,1) .12s!important}
/* профиль игрока */
.k-leg{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4);margin:0 0 var(--sp-4);font-size:12px;color:var(--muted)}
.k-leg span{display:inline-flex;align-items:center;gap:var(--sp-2)}
.k-leg i{width:8px;height:8px;border-radius:50%}.k-leg .free{background:var(--wl-pos)}.k-leg .otp{background:var(--wl-info)}.k-leg .sup{background:var(--wl-warn)}.k-leg .nev{background:var(--muted)}
.k-row b{flex-wrap:wrap;white-space:normal;line-height:1.35}
.k-row b.k-empty{color:var(--muted);font-weight:500}
.k-req{font-style:normal;color:var(--wl-neg);font-weight:700;margin-left:var(--sp-1)}
.k-pend,.k-hint{display:block;font-style:normal;font-size:12px;margin-top:2px}
.k-pend{color:var(--wl-warn)}.k-hint{color:var(--muted)}
.k-lock{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 var(--sp-2);border-radius:var(--r-sm);color:var(--muted);font-size:12px;font-weight:600;transition:color .2s,background .2s}
.k-lock:hover{color:var(--ink);background:var(--card)}
.k-lock svg{width:14px;height:14px}
.k-note{margin:var(--sp-3) 0 0;color:var(--muted);font-size:12px;line-height:1.45}
.k-pct{font-size:13px;font-weight:600;color:var(--muted)}
.k-bar{height:6px;border-radius:3px;background:var(--page);overflow:hidden;margin-bottom:var(--sp-4)}
.k-bar i{display:block;height:100%;border-radius:3px;background:var(--wl-pos);transition:width .5s cubic-bezier(.3,1,.5,1)}
.k-lv{display:flex;flex-direction:column}
.k-l{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:var(--sp-3);align-items:center;padding:var(--sp-2) 0}
.k-l .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--page);color:var(--muted);font-weight:700;font-size:13px}
.k-l .n svg{width:18px;height:18px}
.k-l.ok .n{background:var(--wl-pos);color:#06210f}.k-l.wait .n{background:var(--wl-warn);color:#2a1a02}.k-l.todo .n{background:var(--wl-neg);color:#fff}
.k-l b{display:block;font-size:14px}.k-l small{color:var(--muted);font-size:12px}
.k-l.wait small{color:var(--wl-warn)}.k-l.todo small{color:var(--wl-neg)}
.k-why{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.k-cur{padding:var(--sp-3) var(--sp-4);background:var(--page);border-radius:var(--r-md)}
.k-cur small{display:block;color:var(--muted);font-size:12px}.k-cur b{font-size:16px}
.k-file{display:flex!important;flex-direction:row!important;align-items:center;gap:var(--sp-3)!important;height:52px;padding:0 var(--sp-4);border:1px dashed var(--line);border-radius:var(--r-md);cursor:pointer;color:var(--ink)!important;transition:border-color .2s,background .2s}
.k-file:hover{border-color:var(--wl-info)}
.k-file.on{border-style:solid;border-color:var(--wl-pos)}
.k-file .ic{display:grid;place-items:center;color:var(--muted)}.k-file .ic svg{width:20px;height:20px}
.k-file .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-form select{height:48px;padding:0 var(--sp-4);background:var(--page);border:1px solid var(--line);border-radius:var(--r-md);color:var(--ink);font:600 16px var(--font)}
.wl-form input:disabled{color:var(--muted)}
/* иконки в кнопках крупнее */
.wl-act svg{width:24px;height:24px}
.wl-nav button svg{width:22px;height:22px}
.pe-btns svg,.k-file .ic svg{width:22px;height:22px}
/* депозит — всегда зелёный, как в шапке */
.wl-act.pri.wdep{background:var(--accent-green);color:var(--green-ink);box-shadow:inset 0 0 var(--btn-glow-blur) var(--btn-glow-spread) color-mix(in srgb,var(--glow-sky) 0%,transparent);transition:box-shadow var(--glow-dur) cubic-bezier(.4,0,.2,1)}
.wl-act.pri.wdep:hover,.wl-act.pri.wdep:focus-visible{background:var(--accent-green);box-shadow:inset 0 0 var(--btn-glow-blur) var(--btn-glow-spread) var(--glow-sky)}
.pop .pop-dep svg,.pop-dep svg{color:var(--accent-green)!important}
/* Deposit в меню профиля зовёт сам: периодический «кивок» вниз, без наведения */
#pop .pop-dep svg.icm .g{animation:icm-depnudge 1.8s cubic-bezier(.3,.7,.4,1) .25s infinite}
@keyframes icm-depnudge{0%,46%,100%{transform:none}10%{transform:translateY(-1.2px)}22%{transform:translateY(3px)}32%{transform:translateY(-.8px)}40%{transform:translateY(.3px)}}
@media (prefers-reduced-motion:reduce){#pop .pop-dep svg.icm .g{animation:none}}
.wl-pad button,.pad button{transition:background .15s,transform .15s}
.wl-pad button.kp,.pad button.kp{background:var(--hov2);transform:scale(.94)}
/* лента выигрышей: обложка игры крупнее, скругление соразмерное */
.wcard{width:320px;padding:var(--sp-3) var(--sp-4) var(--sp-3) var(--sp-3);gap:var(--sp-4)}
.wcard img{width:90px;height:120px;border-radius:var(--r-sm)}
.wcard small{font-size:13px;margin-bottom:2px}
.wcard span{font-size:15px;margin-bottom:var(--sp-1)}
.wcard b{font-size:24px;line-height:1.15;letter-spacing:-.01em}
.wcard em{display:inline-block;margin-top:var(--sp-1);font-size:15px}
/* на красных плашках текст всегда белый (в т.ч. в светлой теме) */
html[data-ui="light"] .bw-l,html[data-ui="light"] .bw-l *,html[data-ui="light"] .nav .n,html[data-ui="light"] .b-red,html[data-ui="light"] .has-ind.red>button.b-red,html[data-ui="light"] .atabs>button.on,html[data-ui="light"] .wl-act.pri:not(.wdep),html[data-ui="light"] .wl-cta,html[data-ui="light"] .peek-t span,html[data-ui="light"] .ax-ava,html[data-ui="light"] .pe-ini{color:#fff!important}
/* лиги: значок крупнее, по центру над подписью */
.chipcard{width:136px;height:140px;padding:var(--sp-4) var(--sp-2);display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:var(--sp-2)}
.chipcard i{width:auto;height:auto;flex:1 1 auto;display:grid;place-items:center}
.chipcard i svg{width:44px;height:44px}
.chipcard span{flex:none;min-height:2.5em;font-size:13px;display:-webkit-box;text-align:center}
/* топ-матчи: шире, крупнее, гербы клубов */
.mcard.mc2{flex:1 0 280px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.mc2 header{margin:0;padding:var(--sp-2) var(--sp-4);background:var(--card);align-items:center;font-size:14px;color:var(--ink2)}
.mc2 header .lg{margin:0}
.mc2 .teams{grid-template-columns:1fr auto 1fr;align-items:start;padding:var(--sp-4) var(--sp-4) var(--sp-3);margin:0;gap:var(--sp-2)}
.mc2 .team{flex-direction:column;justify-content:flex-start;align-items:center;gap:var(--sp-2);text-align:center}
.mc2 .team:last-child{justify-content:flex-start;text-align:center}
.mc2 .team>b{font-size:15px;font-weight:600;line-height:1.25}
.mc2 .crest{position:relative;width:52px;height:52px;border-radius:0;background:none}
.mc2 .crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1}
.mc2 .crest b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-size:14px;font-weight:800}
.mc2 .crest img~b{visibility:hidden}
.mc2 .mid{display:flex;flex-direction:column;align-items:center;padding-top:var(--sp-2);min-width:72px}
.mc2 .mid b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.mc2 .mid small{color:var(--accent-red);font-size:13px;font-weight:600;margin-top:var(--sp-1)}
.mc2 .odds{gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-4);margin-top:auto}
.mc2 .odds button{height:54px;flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:0;border-radius:var(--r-md)}
.mc2 .odds button b{font-size:17px;font-weight:700;color:var(--wl-info);font-variant-numeric:tabular-nums}
.mc2 .odds button span{font-size:12px;color:var(--muted);font-weight:600}
.mc2 .odds button.on b,.mc2 .odds button.on span{color:#fff}
@media (max-width:900px){.mcard.mc2{flex-basis:300px}.mc2 .crest{width:48px;height:48px}.mc2 .odds button{height:52px}}
/* Big Win: заголовок раздела вынесен, сумма крупная, анимация появления */
.bw-h{margin-bottom:var(--sp-4)}
.bw-l{justify-content:center;gap:var(--sp-2);min-height:170px}
.bw-l b{font-size:56px}
.bw-l strong{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;display:inline-block;transform-origin:left center}
.bw-l strong.bw-in{animation:bwIn .9s cubic-bezier(.2,1.3,.4,1) both}
.bw-l strong.bw-tick{animation:bwTick .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bwIn{0%{transform:translateY(16px) scale(.92);clip-path:inset(0 100% 0 0)}60%{clip-path:inset(0 0 0 0)}100%{transform:none;clip-path:inset(0 0 0 0)}}
@keyframes bwTick{0%{transform:none}35%{transform:scale(1.045)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.bw-l strong.bw-in,.bw-l strong.bw-tick{animation:none}}
@media (max-width:900px){.bw-l b{font-size:44px}.bw-l strong{font-size:30px}}
/* ===== мобильная навигация: плавающий таббар, меню и шторки снизу ===== */
.bfab{display:none}
@media (max-width:900px){
 #hdr .burger{display:none!important}
 #hdr .bell{display:none!important}
 #hdr .gst{display:none!important}
 #hdr .me,body.guest #hdr .me{display:flex!important;margin-left:0}
 #hdr .me>span:first-child{display:none!important}
 #hdr .me>span:last-child{display:block!important;width:40px;height:40px}
 #hdr .me>span:last-child svg{width:40px;height:40px}
 .bnav,#bnav{z-index:47;left:12px;right:80px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:64px;padding:0 var(--sp-1);border-radius:32px;grid-template-columns:repeat(5,1fr)!important;
  background:color-mix(in srgb,var(--panel) 74%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:none;border:1px solid color-mix(in srgb,var(--ink) 9%,transparent)}
 .bnav button{position:relative;border-radius:28px;font-size:10.5px}
 .bnav button.on,.bnav button.on:hover{box-shadow:none;color:var(--accent-red)}

 .bnav .n{margin:0;top:6px;left:calc(50% + 4px)}
 .bfab{display:grid;place-items:center;position:fixed;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:46;width:56px;height:56px;border-radius:50%;color:#fff;
  background:color-mix(in srgb,var(--accent-red) 84%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
 .bfab:active{transform:scale(.92)}
 .bfab .dot{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--accent-red)}
 .bfab.seen .dot{display:none}
 .tb-menu .ic{display:grid}.tb-menu .ic svg{grid-area:1/1;transition:transform .3s cubic-bezier(.3,1.4,.5,1),opacity .2s}
 .tb-menu .ic svg{width:24px!important;height:24px!important;max-width:24px;max-height:24px}
 #bnav button:focus,#bnav button:focus-visible,.bfab:focus,.bfab:focus-visible{outline:none!important}
 .bfab,.bfab .dot{border-radius:50%!important;corner-shape:round}
 .bfab{border:1px solid color-mix(in srgb,var(--ink) 14%,transparent)}
 #bnav button,#bnav button.on,#bnav button:hover{box-shadow:none!important}
 #bnav button.on,#bnav button.on .ic{color:var(--accent-red)!important}
 .tb-menu .x{transform:rotate(-90deg) scale(.6);opacity:0}
 .tb-menu.on .o{transform:rotate(90deg) scale(.6);opacity:0}.tb-menu.on .x{transform:none;opacity:1}
 #hdr .sp-mob{display:none!important}
 body.guest #hdr .me{margin-left:auto!important}
 /* меню — шторка снизу */
 .side{left:0!important;right:0;top:auto!important;bottom:0;width:auto!important;max-height:88vh;max-height:88dvh;border-radius:24px 24px 0 0;
  padding:var(--sp-2) var(--sp-3) calc(96px + env(safe-area-inset-bottom,0px))!important;transform:translateY(105%)!important;transition:transform .36s cubic-bezier(.2,.9,.3,1)!important;overscroll-behavior:contain}
 .side.open{transform:none!important}
 #side .side-in{position:relative!important}
 .side.dragging,#sheet.dragging .dlg{transition:none!important;animation:none!important}
 .side::before,#sheet .dlg::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 22%,transparent);margin:6px auto var(--sp-3);flex:none}
 .scrim.on{background:rgba(5,8,22,.6)!important;animation:scrIn .25s ease}
 /* шторки: логин, регистрация, профиль и все окна */
 #sheet{place-items:end stretch;padding:0;align-items:end}
 #sheet .dlg,#sheet .dlg.wide,#sheet .dlg.auth{width:100%!important;max-width:none;max-height:92vh;max-height:92dvh;border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:contain}
 #sheet .dlg::before{position:sticky;top:0;margin:8px auto -13px;z-index:3}
 #sheet.on{animation:scrIn .25s ease}
 #sheet.on .dlg{animation:shUp .38s cubic-bezier(.2,.9,.3,1)}
 #sheet.closing{animation:scrOut .26s ease forwards}
 #sheet.closing .dlg{animation:shDown .26s cubic-bezier(.5,0,.75,0) forwards}
}
@keyframes shUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes shDown{from{transform:translateY(var(--dy,0px))}to{transform:translateY(100%)}}
@keyframes scrIn{from{opacity:0}to{opacity:1}}

#sideTip.on{visibility:visible;transform:translate(0,-50%)}
#sideTip::before{content:"";position:absolute;left:-4px;top:50%;width:8px;height:8px;background:inherit;transform:translateY(-50%) rotate(45deg);border-radius:2px}
@media (max-width:900px){.side-tg{display:none}body.side-mini{--side-w:260px}body.side-mini .nav{font-size:var(--nav-fs);gap:var(--sp-2);justify-content:flex-start;padding:0 var(--sp-4)}body.side-mini .modes{flex-direction:row}body.side-mini .modes .b{font-size:18px;gap:var(--sp-2);height:56px}body.side-mini .nav .n,body.side-mini .nav .lang{display:revert}}
/* переключатель темы */
.thm{flex:none;width:44px;height:44px;border-radius:var(--r-md);background:var(--bal-bg);display:grid;place-items:center;color:var(--ink);transition:background .2s}
.thm:hover{background:var(--card)}
.thm svg{width:20px;height:20px}
.thm-nav{display:flex!important}#hdr .thm{display:none!important}.thm-nav .ic svg{width:100%;height:100%}

/* ползунок: полоска и кружок */
input.rng{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0 0 var(--sp-3);cursor:pointer;--p:100%}
input.rng:focus{outline:none}
input.rng::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent-red) 0 var(--p),var(--card) var(--p) 100%)}
input.rng::-moz-range-track{height:4px;border-radius:2px;background:var(--card)}
input.rng::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent-red)}
input.rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;border:5px solid var(--accent-red);transition:transform .15s}
input.rng::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:5px solid var(--accent-red)}
input.rng:active::-webkit-slider-thumb{transform:scale(1.15)}
input.rng:focus-visible::-webkit-slider-thumb{outline:2px solid var(--wl-info);outline-offset:2px}
.sl-ticks{display:flex;justify-content:space-between;margin:-6px 0 var(--sp-3);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
/* всплывающая статистика на карточке игры */

/* ===== редактор ===== */
.eb{position:absolute;top:6px;right:6px;z-index:28;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(9,13,32,.85);box-shadow:0 0 0 1px #01aaff,0 4px 12px rgba(0,0,0,.4);opacity:.7;transition:opacity .15s,transform .15s;color:#01aaff}
.eb:hover{opacity:1;transform:scale(1.1)}
.eb.l{right:auto;left:6px}
body.no-edit .eb{display:none}
.hl{outline:2px dashed #01aaff!important;outline-offset:-2px}
.dock{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:65;display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;max-width:calc(100vw - 32px);font:500 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif}
.dock button,.dock .st{height:34px;padding:0 var(--sp-3);display:inline-flex;align-items:center;gap:var(--sp-2);background:#0f1430;color:#e8eaff;box-shadow:inset 0 0 0 1px #2a3163;white-space:nowrap}
.dock button:hover{box-shadow:inset 0 0 0 1px #01aaff}
.dock .pri{background:#01ff80;color:#004221;box-shadow:inset 0 0 8px 2px #01aaff;font-weight:700}
.dock .st{color:#9aa0c8}
.dock .st.ok{color:#01ff80}
.dock .st.warn{color:#ffb347}
.ed{position:fixed;right:16px;top:calc(var(--hdr-h) + 12px);z-index:70;width:370px;max-width:calc(100vw - 32px);max-height:calc(100vh - var(--hdr-h) - 90px);display:none;flex-direction:column;background:#0c1029;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 0 1px #2a3163;font:500 13px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8eaff}
.ed.on{display:flex}
.ed-h{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);background:#11162e;cursor:move;user-select:none;touch-action:none}
.ed-h b{flex:1;font-size:15px}
.ed-h button{width:28px;height:28px;display:grid;place-items:center;color:#9aa0c8}
.ed-h button:hover{color:var(--ink)}
.ed-tabs{display:flex;gap:var(--sp-1);flex-wrap:wrap;padding:var(--sp-2) var(--sp-3);border-bottom:1px solid #1d2350}
.ed-tabs button{padding:var(--sp-2) var(--sp-2);color:#9aa0c8;font-size:12px}
.ed-tabs button.on{background:#f54346;color:#fff;box-shadow:inset 0 0 6px 2px #1434f1}
.ed-b{overflow:auto;padding:var(--sp-2) var(--sp-4) var(--sp-4)}
.ed-g{margin-top:var(--sp-3);color:#7278a0;font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.ed-r{display:grid;grid-template-columns:118px 1fr;gap:var(--sp-2);align-items:center;padding:var(--sp-1) 0}
.ed-r label{color:var(--ink2);font-size:12px}
.ed-r .c{display:flex;gap:var(--sp-2);align-items:center;min-width:0}
.ed-r input[type=range]{flex:1;min-width:0;accent-color:#f54346}
.ed-r input[type=number],.ed-r input[type=text],.ed-r select{height:28px;background:#090d20;border:1px solid #2a3163;color:var(--ink);padding:0 var(--sp-2);font:inherit;min-width:0}
.ed-r input[type=number]{width:62px}
.ed-r input[type=text]{flex:1}
.ed-r select{flex:1}
.ed-r input[type=color]{width:30px;height:28px;padding:0;border:1px solid #2a3163;background:#090d20;flex:none}
.ed-r .u{color:#7278a0;font-size:11px;width:14px}
.ed-r.chg label{color:#01ff80}
.ed textarea{width:100%;min-height:90px;background:#090d20;border:1px solid #2a3163;color:#e8eaff;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:var(--sp-2);resize:vertical}
.ed-f{display:flex;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);border-top:1px solid #1d2350}
.ed-f button{flex:1;height:32px;background:#11162e;box-shadow:inset 0 0 0 1px #2a3163;color:#e8eaff}
.ed-f .pri{background:#01ff80;color:#004221;font-weight:700;box-shadow:inset 0 0 8px 2px #01aaff}
.code{width:100%;height:50vh;background:#090d20;border:1px solid #2a3163;color:var(--ink2);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:var(--sp-3)}

@media (max-width:1180px){.search{display:none}}
@media (max-width:900px){
  :root{--hdr-h:64px}
  .top{gap:var(--sp-3);padding:0 var(--sp-3)}
  .logo{width:110px}
  .vip,.crown,.me>span,.bell{display:none}
  .burger{display:grid;place-items:center}
  .bal{min-width:0;font-size:15px}.dep{width:auto;font-size:15px}
  .wrap{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:45;width:260px;overflow-y:auto;padding-top:calc(var(--sp-4) + env(safe-area-inset-top,0));transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none}
  .side-in{position:static}
  .scrim.on{display:block;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55)}
  main{padding:var(--sp-3) 0 110px var(--sp-3)}
  .hero{margin-right:var(--sp-3)}
  .sec-h h2{font-size:20px}.sec-h .b-line{display:none}
  .slot{width:140px;height:189px}
  .ed{left:8px;right:8px;width:auto;top:auto;bottom:calc(60px + env(safe-area-inset-bottom,0px));max-height:60vh}
  /* мобильная версия */
  .wallet{height:40px}
  .logo{width:96px}
  .dep{width:40px!important;padding:0!important;justify-content:center!important}.dep-t{display:none}
  .bal{padding:0 var(--sp-2);gap:var(--sp-2)}
  main{padding:var(--sp-3) 0 calc(var(--sp-24) + env(safe-area-inset-bottom,0)) var(--sp-3)}
  .hero{height:var(--m-hero-h);margin-bottom:var(--sp-6)}
  .slide h1{font-size:calc(var(--hero-title-fs) * var(--m-title-k))}
  .slide h1 .ln.big{font-size:calc(var(--hero-big-fs) * var(--m-title-k))}
  .slide h1 .ln.sm{font-size:calc(var(--hero-sm-fs) * var(--m-title-k))}
  .snav{right:var(--snav-r,30px)}
  .peek{display:none}
  .tabs-w{margin-bottom:0}.tabs{margin-bottom:var(--sp-6)}
  .sec{margin-bottom:var(--sp-8)}
  .sec-h{margin-bottom:var(--sp-3)}
  .sec-h .ctl [data-scroll]{display:none}
  .sec-h .b-line{display:inline-flex;font-size:14px;padding:0 var(--sp-1)}
  .ph h1{font-size:24px}
  .cols{grid-template-columns:1fr}
  .dock{bottom:calc(76px + env(safe-area-inset-bottom,0px));left:8px;max-width:calc(100vw - 16px);overflow-x:auto;flex-wrap:nowrap}
  .toast{bottom:calc(132px + env(safe-area-inset-bottom,0px))}
  .slip{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
/* нижняя навигация (только мобильная версия) */
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:35;grid-template-columns:repeat(5,1fr);height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--panel);box-shadow:0 -1px 0 #1d2350}
.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-1);font-size:11px;font-weight:600;color:var(--muted);transition:color .2s}
.bnav .ic{width:24px;height:24px}.bnav .ic svg{width:100%;height:100%}
.bnav button.on{color:#fff;box-shadow:inset 0 3px 0 var(--nav-active-glow)}
.bnav button.on .ic{color:var(--nav-active-icon)}

.bnav .n{position:absolute;margin:calc(-1 * var(--sp-8)) 0 0 var(--sp-6);min-width:18px;height:18px;padding:0 var(--sp-1);display:grid;place-items:center;background:var(--accent-red);color:#fff;font-size:11px;font-weight:700;border-radius:var(--r-sm)}
/* превью мобильной версии на десктопе */
#mprev{position:fixed;inset:0;z-index:60;background:#05070f;display:none;place-items:center;padding:var(--sp-4) var(--sp-4) var(--sp-16)}
body.mview #mprev{display:grid}
body.mview{overflow:hidden}
.phone{position:relative;width:390px;max-width:100%;height:min(844px,calc(100vh - 110px));border-radius:46px;overflow:hidden;background:var(--page);box-shadow:0 0 0 10px #1b1f33,0 0 0 12px #2a3163,0 30px 80px rgba(0,0,0,.6)}
.phone iframe{width:100%;height:100%;border:0;display:block}
.phone-cap{position:absolute;top:-34px;left:0;right:0;text-align:center;color:#7278a0;font:500 12px system-ui,sans-serif}
body.embed .dock,body.embed .ed,body.embed .eb,body.embed #mprev{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

const FIG={};
const IMG={};
function setFig(id,url){IMG[id]=url;$$(`img[data-fig="${id}"]`).forEach(el=>{el.src=url;el.hidden=false;el.closest('.slot')?.classList.add('has-img')});figStatus()}
let figErr='';
function figStatus(){const n=Object.keys(IMG).length,t=Object.keys(FIG).length,el=$('#figSt');
  if(n===t){el.textContent='Figma: images loaded';el.className='st ok'}
  else if(figErr){el.textContent=figErr;el.className='st warn'}
  else{el.textContent=`Figma: ${n}/${t}`;el.className='st'}}
const idb=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('betx',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 return{async get(k){try{const db=await open();return await new Promise(res=>{const q=db.transaction('img').objectStore('img').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})}catch(e){}},
  async set(k,v){try{const db=await open();db.transaction('img','readwrite').objectStore('img').put(v,k)}catch(e){}}}})();
let figBusy=false;
async function loadFigma(force){
  if(figBusy)return;figBusy=true;figErr='';
  try{
    if(!force)for(const id of Object.keys(FIG)){const v=await idb.get(FILE+':'+id);if(v)setFig(id,v)}
    const need=Object.keys(FIG).filter(id=>force||!IMG[id]);
    if(!need.length){figStatus();return}
    const mcp=window.claude&&window.claude.use?await window.claude.use('mcp'):null;
    if(!mcp){figErr='Figma: open on claude.ai to load the images';figStatus();return}
    for(const id of need){
      try{const r=await mcp.callTool('Figma','get_screenshot',{fileKey:FILE,nodeId:id,contentsOnly:true,maxDimension:FIG[id],enableBase64Response:true},{cache:false});
        const b=(r.content||[]).find(x=>x.type==='image');
        if(b){const url=`data:${b.mimeType||'image/png'};base64,${b.data}`;setFig(id,url);idb.set(FILE+':'+id,url)}
      }catch(err){const c=err&&err.code,m=(err&&err.message)||'';
        figErr=/limit|лимит|rate/i.test(m)?'Figma: plan request limit reached, try later':c==='needs_reauth'?'Figma: reconnect the connector in Settings':c==='server_not_connected'?'Figma: connect the connector in Settings → Connectors':c==='not_in_manifest'?'Figma: access for this page is turned off':c==='server_unavailable'?'Figma: server unavailable, try later':'Figma: images unavailable ('+(c||'error')+')';
        figStatus();break}
    }
    figStatus();
  }finally{figBusy=false}
}

  if(slideBusy){pendingSteps=Math.max(-2,Math.min(2,pendingSteps+dir));return}

  $$('.dots button').forEach((d,i)=>d.classList.toggle('on',i===S.slide));

const RUN=new WeakMap();
const cssNum=(v,d)=>{const n=parseFloat(getComputedStyle(root).getPropertyValue(v));return isNaN(n)?d:n};
function drawStats(st,p,q){const [a,b,n]=st.dataset.v.split(',').map(Number),t=st.querySelectorAll('text'),f=st.querySelectorAll('.st-f');
  const A=Math.max(0,p*a),B=Math.max(0,p*b);
  f[0].style.strokeDasharray=Math.min(100,A)+' 100';f[1].style.strokeDasharray=Math.min(100,B)+' 100';
  t[2].textContent=Math.round(A)+'%';t[3].textContent=Math.round(B)+'%';t[4].textContent=Math.max(0,Math.round(q*n)).toLocaleString('en-US');
  st.style.transform=`translateY(${(1-p)*101}%)`}
function playStats(slotEl){const st=slotEl.querySelector('.stats');if(!st)return;cancelAnimationFrame(RUN.get(st)?.raf);clearTimeout(RUN.get(st)?.off);
  const cur=/translateY\(([-\d.]+)%\)/.exec(st.style.transform),from=cur?1-parseFloat(cur[1])/101:0;st.style.transition='none';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){drawStats(st,1,1);return}
  const k=cssNum('--st-stiff',170),c=cssNum("--st-damp",18);
  const s={x:Math.max(0,Math.min(1,from))*0,v:0,last:performance.now()};RUN.set(st,s);
  const step=now=>{let dt=Math.min(.05,(now-s.last)/1000);s.last=now;
    for(let i=0;i<4;i++){const h=dt/4;s.v+=(-k*(s.x-1)-c*s.v)*h;s.x+=s.v*h}
    drawStats(st,s.x,s.x);
    if(Math.abs(s.x-1)+Math.abs(s.v)<.0005){drawStats(st,1,1);return}
    s.raf=requestAnimationFrame(step)};
  s.raf=requestAnimationFrame(step)}
function stopStats(slotEl){const st=slotEl.querySelector('.stats');if(!st)return;const s=RUN.get(st);if(s)cancelAnimationFrame(s.raf);
  st.style.transition='transform .22s cubic-bezier(.4,0,1,1)';st.style.transform='translateY(101%)';
  const off=setTimeout(()=>{st.style.transition='none';drawStats(st,0,0)},240);RUN.set(st,{off})}
document.addEventListener('mouseover',e=>{const s=e.target.closest('.slot');if(!s||(e.relatedTarget&&s.contains(e.relatedTarget))||s.closest('.track.drag'))return;playStats(s)});

document.addEventListener('focusin',e=>{if(e.target.matches('.slot'))playStats(e.target)});
document.addEventListener('focusout',e=>{if(e.target.matches('.slot'))stopStats(e.target)});

const RANGE={all:Infinity,'24h':864e5,week:7*864e5,month:30*864e5};

function inRange(d,r){if(S.pick){const a=new Date(S.pick).setHours(0,0,0,0);return d>=a&&d<a+864e5}return Date.now()-d<=RANGE[r]}
function pager(n,cur,attr){if(n<=1)return '';const pg=[];for(let i=1;i<=n;i++){if(i<=5||i===n||Math.abs(i-cur)<=1)pg.push(i);else if(pg[pg.length-1]!=='…')pg.push('…')}
 return `<div class="pager">${pg.map(p=>p==='…'?'<span>…</span>':`<button class="${p===cur?'on':''}" ${attr}="${p}">${p}</button>`).join('')}</div>`}

(function(){const SEL='.wl-nav,.wl-seg,.atabs,.tabs,.chips2,.seg';let mem=new Map(),busy=false;

  document.querySelectorAll(SEL).forEach(c=>{const red=c.matches('.tabs,.chips2,.seg'),a=c.querySelector(red?':scope>button.b-red,:scope>button.b-green':':scope>button.on');let ind=c.querySelector(':scope>.seg-ind');const k=sig(c);

   const r=rect(a),set=x=>{ind.style.transform=`translate(${x.l}px,${x.t}px)`;ind.style.width=x.w+'px';ind.style.height=x.h+'px'};

  mem=next;busy=false}

/* сумма Big Win: счётчик при появлении (0 → сумма) и постоянное прибавление */
(function(){let shown=new WeakSet(),cur=BIGV,anim=null;
 const ease=t=>1-Math.pow(1-t,4);
 function paint(v){$$('[data-big]').forEach(e=>e.textContent=bigFmt(v))}
 function countUp(el){const t0=performance.now(),D=1600,to=BIGV;el.classList.add('bw-in');
  (function f(t){const k=Math.min(1,(t-t0)/D);el.textContent=bigFmt(to*ease(k));if(k<1)requestAnimationFrame(f);else{el.textContent=bigFmt(BIGV)}})(t0)}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!shown.has(e.target)){shown.add(e.target);countUp(e.target);io.unobserve(e.target)}}),{threshold:.4});
 new MutationObserver(()=>$$('[data-big]').forEach(e=>{if(!e._obs){e._obs=1;io.observe(e)}})).observe(document.body,{childList:true,subtree:true});
 $$('[data-big]').forEach(e=>{e._obs=1;io.observe(e)});
 /* каждые ~2.5 с сумма растёт: плавная прокрутка цифр к новому значению */
 setInterval(()=>{const from=BIGV,add=+(5+Math.random()*240).toFixed(2);BIGV=+(from+add).toFixed(2);try{store.set('bigv',BIGV)}catch(e){}
  const els=$$('[data-big]').filter(e=>shown.has(e));if(!els.length)return;const t0=performance.now(),D=900;
  els.forEach(e=>{e.classList.remove('bw-tick');void e.offsetWidth;e.classList.add('bw-tick')});
  (function f(t){const k=Math.min(1,(t-t0)/D),v=from+(BIGV-from)*ease(k);els.forEach(e=>e.textContent=bigFmt(v));if(k<1)requestAnimationFrame(f)})(t0)},2600);
})();

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('#pop').classList.contains('on'))return closePop();if($('#sheet').classList.contains('on'))return closeSheet();if($('#modal').classList.contains('on')){$('#modal').classList.remove('on');autoLeft=0;return}if($('#ed').classList.contains('on'))return $('#ed').classList.remove('on');closeMenu()}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('.slot')){e.preventDefault();openGame(e.target.dataset.play)}
 if(e.target.id==='hero'&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))goSlide(S.slide+(e.key==='ArrowRight'?1:-1),e.key==='ArrowRight'?1:-1);
});
['modal','sheet'].forEach(id=>$('#'+id).addEventListener('click',e=>{if(e.target.id===id){id==='modal'?($('#modal').classList.remove('on'),autoLeft=0):closeSheet()}}));
$('#q').addEventListener('input',e=>{S.q=e.target.value.trim();S.mode='casino';render()});
setBal(0);render();if(!EMBED){vmLabel();if(store.get('view','d')==='m')setView('m')}
</script>
</body>
</html>
